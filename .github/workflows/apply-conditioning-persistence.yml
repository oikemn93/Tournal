name: Apply conditioning persistence patch

on:
  push:
    branches: [main]
    paths:
      - tools/patch_conditioning_persistence.py
      - .github/workflows/apply-conditioning-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply patch
        run: python tools/patch_conditioning_persistence.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit functional patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts src/app/App.tsx src/app/screens/StockView.tsx
          git diff --cached --quiet || git commit -m "fix: persist conditioning settings"
          git push
