name: Align client stock UI
on:
  push:
    paths:
      - scripts/align-client-stock-ui.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/align-client-stock-ui.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit functional change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/ClientsView.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: reflect immediate client stock commitment"
          git pull --rebase origin main
          git push origin main
