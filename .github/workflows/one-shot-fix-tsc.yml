name: One-shot fix TSC
on:
  push:
    branches: [feat/ux-fifo-audit-supervision]
permissions: {contents: write}
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/ux-fifo-audit-supervision}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/screens/ClientsView.tsx')
          s=p.read_text().replace('Date.parse(inv.dateRaw??inv.date)','Date.parse(inv.date)')
          p.write_text(s)
          p=Path('src/app/screens/StockView.tsx')
          s=p.read_text()
          root='<div data-screen-source="relational-stock" className="space-y-4 pb-24">'
          card="""<div data-screen-source=\"relational-stock\" className=\"space-y-4 pb-24\">\n      {canManageReferenceCosts && missingCosts.length > 0 && <div className=\"rounded-2xl border border-amber-300 bg-amber-50 p-4 space-y-3\"><p className=\"text-sm font-black text-amber-900\">Prix d’achat à compléter · {missingCosts.length}</p><p className=\"text-xs text-amber-800\">Saisissez uniquement le coût réel de chaque réception. Aucune estimation automatique.</p>{missingCosts.map(row=><div key={row.entry_id} className=\"flex gap-2 items-center\"><span className=\"flex-1 text-xs font-bold\">{row.product_name} · {row.qty}</span><input inputMode=\"decimal\" value={costDrafts[row.entry_id]??\"\"} onChange={e=>setCostDrafts(v=>({...v,[row.entry_id]:e.target.value}))} className=\"w-24 rounded-lg border px-2 py-1 text-xs\" placeholder=\"F/unité\"/><button type=\"button\" disabled={costSaving===row.entry_id} onClick={()=>void saveMissingCost(row)} className=\"rounded-lg bg-amber-700 px-2 py-1 text-xs font-black text-white\">Valider</button></div>)}</div>}"""
          if 'Prix d’achat à compléter' not in s:
              s=s.replace(root,card,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet || (git commit -m 'fix: complete sorting and missing-cost UI' && git push origin HEAD:feat/ux-fifo-audit-supervision)
