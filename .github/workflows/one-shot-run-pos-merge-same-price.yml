name: One-shot run POS merge same price

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-run-pos-merge-same-price.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python scripts/patch_pos_merge_same_price.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/screens/POSView.tsx
          git commit -m 'fix: merge repeated POS selections at same price'
          git push origin HEAD:main
