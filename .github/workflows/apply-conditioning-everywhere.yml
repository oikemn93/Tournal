name: Apply conditioning everywhere

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_conditioning_everywhere.py'
      - '.github/workflows/apply-conditioning-everywhere.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python tools/patch_conditioning_everywhere.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit rollout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/POSView.tsx src/app/screens/FacturesView.tsx src/app/screens/TransfersView.tsx src/lib/api.ts
          git diff --cached --quiet || git commit -m "feat: restore conditioning across sales and transfers"
          git push
