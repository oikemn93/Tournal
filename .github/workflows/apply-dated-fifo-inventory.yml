name: Apply dated FIFO inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-dated-fifo-inventory.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply patch
        run: python tools/patch_dated_fifo_inventory.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/InventoryView.tsx src/lib/inventoryApi.ts
          git diff --cached --quiet || git commit -m "feat: dated FIFO inventory reports"
          git push
