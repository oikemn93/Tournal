name: Fix stock bootstrap merge once v2

on:
  push:
    branches:
      - fix/stock-integrity-p0
    paths:
      - .github/workflows/fix-stock-bootstrap-once-v2.yml

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stock-integrity-p0
      - name: Apply deterministic patch
        run: python3 scripts/fix-stock-bootstrap-merge.py
      - name: Validate patch
        run: |
          grep -q 'mergeStockEntriesPreservingCurrentQty' src/app/App.tsx
          grep -q 'return productQty(p.id, entries);' src/app/screens/POSView.tsx
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx src/app/screens/POSView.tsx
          git commit -m 'Fix deferred stock history double counting'
          git push origin HEAD:fix/stock-integrity-p0
