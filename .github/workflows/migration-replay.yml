name: Canonical database replay

on:
  push:
    branches: [chore/canonical-database-replay]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify deployable migration changes are dedicated and manifest-backed
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD -- supabase/migrations || true)"
          if [ -z "$changed" ]; then
            echo 'deployable_supabase_migrations_unchanged'
            exit 0
          fi
          if [[ "${PR_HEAD_REF:-}" != chore/db-migrations/* ]]; then
            echo 'Deployable Supabase migrations may only change in a dedicated chore/db-migrations/* PR.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          manifest='.github/audit/remote-migration-manifest.txt'
          test -s "$manifest"
          while IFS= read -r path; do
            status="$(git diff --name-status origin/main...HEAD -- "$path" | awk 'NR==1{print $1}')"
            if [ "$status" != A ]; then
              echo "Dedicated migration PRs may only add immutable migration files: $path ($status)" >&2
              exit 1
            fi
            base="$(basename "$path")"
            version="${base%%_*}"
            logical="${base#*_}"; logical="${logical%.sql}"
            if ! [[ "$version" =~ ^[0-9]{14}$ ]]; then
              echo "Migration filename must use a 14-digit production version: $base" >&2
              exit 1
            fi
            if ! grep -Fxq "$version|$logical" "$manifest"; then
              echo "Migration is not recorded in the production manifest: $version|$logical" >&2
              exit 1
            fi
          done <<< "$changed"
          echo 'dedicated_manifest_backed_migrations_verified'

      - name: Preserve the exact Stage A migration outside legacy replay normalization
        run: |
          mkdir -p /tmp/access-request-candidate
          if [ -f supabase/migrations/20260929204856_access_requests_stage_a.sql ]; then
            cp supabase/migrations/20260929204856_access_requests_stage_a.sql /tmp/access-request-candidate/stage-a.sql
            sha256sum /tmp/access-request-candidate/stage-a.sql
            rm supabase/migrations/20260929204856_access_requests_stage_a.sql
          fi
          mkdir -p /tmp/post-stage-a
          while IFS= read -r migration; do
            test -n "$migration" || continue
            test -s "supabase/migrations/$migration"
            cp "supabase/migrations/$migration" "/tmp/post-stage-a/$migration"
            rm "supabase/migrations/$migration"
          done < .github/audit/post-stage-a-replay.txt
      - name: Prepare canonical legacy replay
        run: bash scripts/prepare-canonical-replay.sh

      - name: Validate Python tools and connector snapshot guard
        run: |
          python3 -m py_compile scripts/*access-request*.py
          python3 scripts/test-access-request-snapshot.py
          python3 scripts/test-access-request-current-schema.py
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Replay complete Git migration history
        run: supabase db reset --local --no-seed --debug
      - name: Export baseline and apply the unchanged Stage A candidate locally
        if: hashFiles('.github/audit/access-request-objects.json') != ''
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f .github/audit/access-request-signatures.sql > baseline-access-signatures.txt
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f .github/audit/schema-fingerprint.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 --single-transaction -f /tmp/access-request-candidate/stage-a.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f .github/audit/access-request-signatures.sql > candidate-access-signatures.txt
          python3 scripts/test-access-request-delta.py
          python3 scripts/check-access-request-delta.py baseline-access-signatures.txt candidate-access-signatures.txt baseline-access-signatures.txt
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f scripts/test-access-requests-db.sql
          python3 scripts/test-access-requests-race.py
      - name: Replay already-applied migrations after the frozen Stage A baseline
        run: |
          while IFS= read -r migration; do
            test -n "$migration" || continue
            psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 --single-transaction -f "/tmp/post-stage-a/$migration"
          done < .github/audit/post-stage-a-replay.txt
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f .github/audit/access-request-signatures.sql > current-access-signatures.txt
      - name: Count applied migrations
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -Atc "select count(*) from supabase_migrations.schema_migrations;"
      - name: Run stock integrity matrix on production-equivalent schema
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-stock-integrity-db.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-inventory-race-db.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-commercial-transfer-stock-db.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-dashboard-fifo-db.sql
      - name: Export local hashed schema signatures
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -f .github/audit/schema-signature-manifest.sql > local-schema-signatures.txt
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -f .github/audit/function-component-manifest.sql > local-function-components.txt
          test -s local-schema-signatures.txt; test -s local-function-components.txt
      - name: Compare production through live read or reviewed connector snapshot
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGOPTIONS: -c default_transaction_read_only=on
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PGPASSWORD:-}" ]; then
            psql "host=aws-0-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.cnxtylngddwmhugxkzju sslmode=require connect_timeout=10" -X -v ON_ERROR_STOP=1 -f .github/audit/schema-signature-manifest.sql > production-schema-signatures.txt
            psql "host=aws-0-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.cnxtylngddwmhugxkzju sslmode=require connect_timeout=10" -X -v ON_ERROR_STOP=1 -f .github/audit/access-request-signatures.sql > production-access-signatures.txt
          else
            python3 scripts/export-access-request-snapshot.py
          fi
          test -s production-schema-signatures.txt
          test -s production-access-signatures.txt
          python3 scripts/check-access-request-current-schema.py current-access-signatures.txt production-access-signatures.txt
      - name: Build exact hashed schema diff
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s production-schema-signatures.txt ]; then echo 'Direct production signature file unavailable; connector-based production diff remains authoritative.'; : > schema-diff.txt; exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          sig=re.compile(r'^[0-9a-f]{32}$')
          def load(path):
              out={}
              for raw in Path(path).read_text().splitlines():
                  parts=raw.split('|')
                  if len(parts)==3 and sig.fullmatch(parts[2]): out[(parts[0],parts[1])]=parts[2]
              return out
          local=load('local-schema-signatures.txt'); prod=load('production-schema-signatures.txt')
          if not local or not prod: raise SystemExit('signature manifest unexpectedly empty')
          rows=[]
          for key in sorted(set(local)|set(prod)):
              lh=local.get(key); ph=prod.get(key); category,identity=key
              if lh is None: rows.append(f'prod_only|{category}|{identity}|{ph}|')
              elif ph is None: rows.append(f'local_only|{category}|{identity}||{lh}')
              elif lh!=ph: rows.append(f'modified|{category}|{identity}|{ph}|{lh}')
          Path('schema-diff.txt').write_text('\n'.join(rows)+('\n' if rows else ''))
          print(f'local_objects={len(local)} production_objects={len(prod)} diff_rows={len(rows)}')
          for category in sorted({k[0] for k in set(local)|set(prod)}):
              p=sum(1 for k in prod if k[0]==category); l=sum(1 for k in local if k[0]==category); d=sum(1 for r in rows if r.split('|',2)[1]==category)
              print(f'{category}: local={l} prod={p} diff={d}')
          PY
      - name: Upload hashed schema diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-signatures
          path: |
            local-schema-signatures.txt
            local-function-components.txt
            production-schema-signatures.txt
            schema-diff.txt
            baseline-access-signatures.txt
            candidate-access-signatures.txt
            current-access-signatures.txt
            production-access-signatures.txt
          if-no-files-found: error
          retention-days: 1
      - name: Compare legacy production fingerprint
        if: hashFiles('.github/audit/access-request-objects.json') == ''
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -f .github/audit/schema-fingerprint.sql
      - name: Run business smoke after the exact candidate comparison
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f scripts/test-business-smoke.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f scripts/test-supplier-ledger-db.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
