name: Fix Ops boutiques screen
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-ops-boutiques-screen.mjs
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-ops-boutiques-screen.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/components/TournalOpsWorkspace.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: prevent blank Ops boutique detail screen"
          git push origin main
