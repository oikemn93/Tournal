name: One-shot self supplier badge and admin PIN
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-self-supplier-badge-admin-pin.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Patch UI and admin timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/app/App.tsx')
          s=p.read_text()
          old='const LOCK_TIMEOUT_MS = lockTimeoutMs; // alias for existing refs'
          new='const LOCK_TIMEOUT_MS = currentUser?.isSuperAdmin ? Math.max(lockTimeoutMs, 60 * 60 * 1000) : lockTimeoutMs; // SuperAdmin: minimum 60 min before PIN lock'
          if old not in s: raise SystemExit('LOCK_TIMEOUT_MS anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/app/screens/FournisseursView.tsx')
          s=p.read_text()
          old='''<div className="flex items-center gap-3"><div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl text-base font-black" style={{background:supplier.color+"22",color:supplier.color}}>{supplier.initials}</div><div className="min-w-0 flex-1"><p className="font-black">{supplier.nom}</p><p className="mt-0.5 flex items-center gap-1 text-xs text-muted-foreground"><MapPin size={11}/>{supplier.ville || "Ville non renseignée"}</p></div><span className="rounded-full px-2 py-1 text-[10px] font-black" style={supplier.linkedBoutiqueId?{background:"#dbeafe",color:"#1d4ed8"}:{background:"#f3f4f6",color:"#64748b"}}>{supplier.linkedBoutiqueId?"Inter-boutique":"Externe"}</span></div>'''
          new='''<div className="flex items-center gap-3"><div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl text-base font-black" style={{background:supplier.color+"22",color:supplier.color}}>{supplier.initials}</div><div className="min-w-0 flex-1"><p className="font-black">{supplier.nom}</p><p className="mt-0.5 flex items-center gap-1 text-xs text-muted-foreground"><MapPin size={11}/>{supplier.ville || "Ville non renseignée"}</p></div><span className="rounded-full px-2 py-1 text-[10px] font-black" style={supplier.linkedBoutiqueId===boutique.id?{background:"#fef3c7",color:"#92400e"}:supplier.linkedBoutiqueId?{background:"#dbeafe",color:"#1d4ed8"}:{background:"#f3f4f6",color:"#64748b"}}>{supplier.linkedBoutiqueId===boutique.id?"Boutique elle-même":supplier.linkedBoutiqueId?"Inter-boutique":"Externe"}</span></div>'''
          if old not in s: raise SystemExit('supplier detail badge anchor not found')
          s=s.replace(old,new,1)

          old='''<span className="ml-1 rounded-full px-1.5 py-0.5 text-[10px] font-black" style={supplier.linkedBoutiqueId?{background:"#dbeafe",color:"#1d4ed8"}:{background:"#f3f4f6",color:"#64748b"}}>{supplier.linkedBoutiqueId?"Inter-boutique":"Externe"}</span>'''
          new='''<span className="ml-1 rounded-full px-1.5 py-0.5 text-[10px] font-black" style={supplier.linkedBoutiqueId===boutique.id?{background:"#fef3c7",color:"#92400e"}:supplier.linkedBoutiqueId?{background:"#dbeafe",color:"#1d4ed8"}:{background:"#f3f4f6",color:"#64748b"}}>{supplier.linkedBoutiqueId===boutique.id?"Boutique elle-même":supplier.linkedBoutiqueId?"Inter-boutique":"Externe"}</span>'''
          if old not in s: raise SystemExit('supplier list badge anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx src/app/screens/FournisseursView.tsx
          git commit -m 'feat: distinguish self supplier and extend admin PIN timeout'
          git push origin HEAD:main
