name: One-shot wire Tournal Ops
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-wire-tournal-ops.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Wire Tournal Ops
        run: node scripts/patch-tournal-ops.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx
          git commit -m 'feat: activate Tournal Ops for superadmin'
          git push origin HEAD:main
