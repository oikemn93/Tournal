name: Apply Session Lock Fix
on:
  push:
    branches: [fix/session-lock-timing]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[session-lock-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-lock-timing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-session-lock-fix.mjs
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx src/lib/api.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(auth): honor configured idle lock exactly [session-lock-patch]'
          git push origin HEAD:fix/session-lock-timing
