name: Emergency repair
on:
  push:
    paths:
      - '.github/workflows/emergency-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hotfix boutique bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/api.ts')
          s=p.read_text()
          old='client_advances?select=*${scoped()}&or=(paid_at.gte.${historyFromFilter},and(allocated_amount.not.is.null,amount.not.is.null,allocated_amount.lt.amount))&order=paid_at.desc,id.desc'
          new='client_advances?select=*${scoped()}&order=paid_at.desc,id.desc'
          if old not in s: raise SystemExit('broken advance filter not found')
          p.write_text(s.replace(old,new))
          PY
          npm install --no-audit --no-fund
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts
          git commit -m 'fix: restore boutique data loading'
          git push