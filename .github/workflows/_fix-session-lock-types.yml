name: Fix Session Lock Types
on:
  push:
    branches: [fix/session-lock-timing]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[session-lock-types-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-lock-timing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-session-lock-types.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(auth): complete auth settings fallback shape [session-lock-types-fixed]'
          git push origin HEAD:fix/session-lock-timing
