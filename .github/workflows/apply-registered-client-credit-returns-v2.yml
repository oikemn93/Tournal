name: Apply registered client credit returns v2
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-registered-client-credit-returns-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/patch_registered_client_credit_returns_v2.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/types.ts src/lib/api.ts src/app/screens/ClientsView.tsx src/app/screens/FacturesView.tsx src/app/screens/RapportView.tsx src/app/utils/invoice.ts
          git diff --cached --quiet || git commit -m "feat: separate registered client returns from refunds"
          git push
