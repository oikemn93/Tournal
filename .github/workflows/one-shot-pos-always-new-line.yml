name: One-shot POS always new line

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-pos-always-new-line.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch POS repeated product behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/app/screens/POSView.tsx')
          s = p.read_text()

          pattern = r'''  function openAdd\(p: Product\) \{\n(?:    .*\n){7}  \}'''
          replacement = '''  function openAdd(p: Product) {\n    const defaultUnit = getDefaultSaleUnit(p, boutique);\n    const lastPrice = getLastSalePrice(p.id, invoices, defaultUnit);\n    setAddModal(p);\n    setAddSellUnit(defaultUnit);\n    setAddQty("");\n    setAddPrice(lastPrice != null ? String(lastPrice) : "");\n  }'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'openAdd patch count={n}')
          s = s2

          start = s.index('    setCart(prev => {', s.index('  function confirmAdd()'))
          end = s.index('    setAddModal(null);', start)
          s = s[:start] + '    setCart(prev => [...prev, item]);\n' + s[end:]

          old = '<SubmitBtn color={POS_COLOR} label={cart.find(i=>i.productId===addModal.id)?"Mettre à jour":"Ajouter au panier"} onClick={confirmAdd} disabled={!addQty||!addPrice||Number(addQty)<=0||Number(addPrice)<=0}/>'
          new = '<SubmitBtn color={POS_COLOR} label="Ajouter au panier" onClick={confirmAdd} disabled={!addQty||!addPrice||Number(addQty)<=0||Number(addPrice)<=0}/>'
          if old not in s:
              raise SystemExit('SubmitBtn label not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Verify behavior
        shell: bash
        run: |
          grep -F 'const defaultUnit = getDefaultSaleUnit(p, boutique);' src/app/screens/POSView.tsx
          grep -F 'setAddQty("");' src/app/screens/POSView.tsx
          grep -F 'setCart(prev => [...prev, item]);' src/app/screens/POSView.tsx
          grep -F 'label="Ajouter au panier"' src/app/screens/POSView.tsx
          ! grep -F 'Mettre à jour' src/app/screens/POSView.tsx
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/screens/POSView.tsx
          git commit -m 'fix: always add repeated POS products as new lines'
          git push origin HEAD:main
