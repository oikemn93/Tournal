name: One-shot bounded bootstrap patch
on:
  push:
    paths:
      - '.github/workflows/one-shot-bounded-bootstrap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bound initial invoice history and lazy-load older days
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/api.ts')
          s=p.read_text()
          old='export async function loadBoutiqueSnapshot<T>(boutiqueId: string): Promise<T | null> {\n    const bid = encodeURIComponent(boutiqueId);\n    const boutiqueFilter = `&id=eq.${bid}`;\n    const scoped = (column = "boutique_id") => `&${column}=eq.${bid}`;'
          new='''export type BoutiqueSnapshotOptions = {\n  historyFrom?: string;\n  historyTo?: string;\n  historyOnly?: boolean;\n};\n\nconst BOOTSTRAP_HISTORY_DAYS = 30;\n\nfunction defaultBootstrapHistoryFrom() {\n  const date = new Date();\n  date.setUTCDate(date.getUTCDate() - BOOTSTRAP_HISTORY_DAYS);\n  return date.toISOString().slice(0, 10);\n}\n\nexport async function loadBoutiqueSnapshot<T>(boutiqueId: string, options: BoutiqueSnapshotOptions = {}): Promise<T | null> {\n    const bid = encodeURIComponent(boutiqueId);\n    const boutiqueFilter = `&id=eq.${bid}`;\n    const scoped = (column = "boutique_id") => `&${column}=eq.${bid}`;\n    const historyFrom = options.historyFrom ?? defaultBootstrapHistoryFrom();\n    const historyTo = options.historyTo;\n    const invoiceWindow = `${historyFrom ? `&invoice_date=gte.${encodeURIComponent(historyFrom)}` : ""}${historyTo ? `&invoice_date=lt.${encodeURIComponent(historyTo)}` : ""}`;\n    const paymentWindow = `${historyFrom ? `&paid_at=gte.${encodeURIComponent(historyFrom)}` : ""}${historyTo ? `&paid_at=lt.${encodeURIComponent(historyTo)}` : ""}`;'''
          if old not in s: raise SystemExit('snapshot signature anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('dataRequest<any[]>(`invoices?select=*,invoice_lines(*)${scoped()}`),\n      dataRequest<any[]>(`invoice_payments?select=*${scoped()}&order=paid_at.asc`),', 'dataRequest<any[]>(`invoices?select=*,invoice_lines(*)${scoped()}${invoiceWindow}&order=invoice_date.desc`),\n      dataRequest<any[]>(`invoice_payments?select=*${scoped()}${paymentWindow}&order=paid_at.asc`),',1)
          # History-only reads deliberately avoid re-downloading the heavy stock ledger and unrelated domains.
          s=s.replace('dataRequestAll<any>(`stock_entries?select=*${scoped()}`, "entry_date.desc,id.desc"), dataRequest<any[]>(`clients?select=*${scoped()}`),', '(options.historyOnly ? Promise.resolve([]) : dataRequestAll<any>(`stock_entries?select=*${scoped()}`, "entry_date.desc,id.desc")), dataRequest<any[]>(`clients?select=*${scoped()}`),',1)
          s=s.replace('dataRequest<any[]>(`categories?select=*${scoped()}`), dataRequest<any[]>(`products?select=*${scoped()}`),', '(options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`categories?select=*${scoped()}`)), (options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`products?select=*${scoped()}`)),',1)
          s=s.replace('dataRequest<any[]>(`suppliers?select=*${scoped()}`),', '(options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`suppliers?select=*${scoped()}`)),',1)
          s=s.replace('dataRequest<any[]>(`client_advances?select=*${scoped()}&order=paid_at.desc,id.desc`),\n      dataRequest<any[]>(`client_credit_refunds?select=*${scoped()}&order=refunded_at.desc,id.desc`), dataRequest<any[]>(`charges?select=*${scoped()}`),\n      dataRequest<any[]>(`caisse_sessions?select=*${scoped()}`),', '(options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`client_advances?select=*${scoped()}&order=paid_at.desc,id.desc`)),\n      (options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`client_credit_refunds?select=*${scoped()}&order=refunded_at.desc,id.desc`)), (options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`charges?select=*${scoped()}`)),\n      (options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`caisse_sessions?select=*${scoped()}`)),',1)
          s=s.replace('dataRequest<any[]>(`audit_log?select=*${scoped()}&order=created_at.desc&limit=200`),', '(options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`audit_log?select=*${scoped()}&order=created_at.desc&limit=200`)),',1)
          p.write_text(s)

          p=Path('src/app/screens/FacturesView.tsx')
          s=p.read_text()
          s=s.replace('createSale, recordPayment, recordMultiPayment, returnSale, openCaisseSession, closeCaisseSession, createInvoiceShare', 'createSale, recordPayment, recordMultiPayment, returnSale, openCaisseSession, closeCaisseSession, createInvoiceShare, loadBoutiqueSnapshot',1)
          anchor='''  const [selectedDay, setSelectedDay] = useState(todayKey);\n  const [dayFilterActive, setDayFilterActive] = useState(initialStatus !== "impayé" && initialStatus !== "en retard");'''
          insert='''  const [selectedDay, setSelectedDay] = useState(todayKey);\n  const [dayFilterActive, setDayFilterActive] = useState(initialStatus !== "impayé" && initialStatus !== "en retard");\n  const [historyLoadingDay, setHistoryLoadingDay] = useState<string | null>(null);\n  const [loadedHistoryDays, setLoadedHistoryDays] = useState<Set<string>>(() => new Set());\n  const bootstrapCutoff = useMemo(() => {\n    const date = new Date();\n    date.setUTCDate(date.getUTCDate() - 30);\n    return date.toISOString().slice(0, 10);\n  }, []);\n\n  useEffect(() => {\n    if (!dayFilterActive || selectedDay >= bootstrapCutoff || loadedHistoryDays.has(selectedDay) || historyLoadingDay === selectedDay) return;\n    let cancelled = false;\n    const next = new Date(selectedDay + "T00:00:00Z");\n    next.setUTCDate(next.getUTCDate() + 1);\n    setHistoryLoadingDay(selectedDay);\n    void loadBoutiqueSnapshot<Boutique[]>(boutique.id, { historyFrom:selectedDay, historyTo:next.toISOString().slice(0,10), historyOnly:true })\n      .then(rows => {\n        if (cancelled) return;\n        const historical = rows?.[0]?.invoices ?? [];\n        if (historical.length) {\n          const merged = new Map(boutique.invoices.map(invoice => [invoice.id, invoice]));\n          historical.forEach(invoice => merged.set(invoice.id, invoice));\n          onUpdate({ invoices:[...merged.values()].sort((a,b)=>(b.dateRaw ?? "").localeCompare(a.dateRaw ?? "")) });\n        }\n        setLoadedHistoryDays(previous => new Set(previous).add(selectedDay));\n      })\n      .catch(error => console.error("Chargement historique factures impossible", error))\n      .finally(() => { if (!cancelled) setHistoryLoadingDay(null); });\n    return () => { cancelled = true; };\n  }, [boutique.id, boutique.invoices, bootstrapCutoff, dayFilterActive, historyLoadingDay, loadedHistoryDays, onUpdate, selectedDay]);'''
          if anchor not in s: raise SystemExit('Factures day anchor missing')
          s=s.replace(anchor,insert,1)
          # Surface loading state without changing navigation semantics.
          s=s.replace('{dayFilterActive ? dayLabel : "Toutes les factures"}', '{historyLoadingDay===selectedDay ? "Chargement…" : dayFilterActive ? dayLabel : "30 derniers jours"}',1)
          p.write_text(s)
          PY
      - run: pnpm build
      - name: Commit bounded bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/api.ts src/app/screens/FacturesView.tsx
          git commit -m 'perf: bound initial invoice bootstrap' || exit 0
          git push
