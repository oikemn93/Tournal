name: One-shot Ops final UI
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-ops-final-ui.mjs
      - .github/workflows/one-shot-ops-final-ui.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/patch-ops-final-ui.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/components/TournalOpsWorkspace.tsx src/lib/ops.ts
          git diff --cached --quiet || git commit -m 'feat: finish Ops account directory and SLA alerts'
          git push
