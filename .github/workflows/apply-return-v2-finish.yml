name: Apply return v2 completion
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-return-v2-finish.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply base return v2 patch
        run: |
          set +e
          output=$(python tools/patch_return_v2_finish.py 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ] && ! printf '%s' "$output" | grep -q 'Invoice message return block missing'; then
            exit "$code"
          fi
      - run: python tools/patch_return_v2_finish_tail.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/types.ts src/lib/api.ts src/app/screens/FacturesView.tsx src/app/screens/ClientsView.tsx src/app/utils/invoice.ts src/app/screens/RapportView.tsx src/app/screens/StockView.tsx
          git diff --cached --quiet || git commit -m "feat: complete return v2 workflow"
          git push
