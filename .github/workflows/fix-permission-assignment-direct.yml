name: Fix permission assignment direct
on:
  push:
    paths:
      - scripts/fix-permission-assignment-direct.mjs
      - .github/workflows/fix-permission-assignment-direct.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-permission-assignment-direct.mjs
      - run: node scripts/test-permission-contract.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts scripts/test-permission-contract.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: route all assignment writes through permission RPC"
          git restore scripts/fix-permission-assignment-direct.mjs
          git pull --rebase origin main
          git push origin main
