name: Fix cashier disbursement preset
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-decaissement-caissier.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/fix_decaissement_caissier.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx src/app/constants.ts
          git diff --cached --quiet || git commit -m "fix: default cashier disbursement right to false"
          git push
