name: Apply client upgrade

on:
  push:
    branches: [main]
    paths:
      - "tools/client_notification_upgrade.py"
      - ".github/workflows/apply-client-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply source upgrade
        run: python3 tools/client_notification_upgrade.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit upgraded sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api.ts src/lib/notifications.ts src/app/screens/ClientsView.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: client workspace and notification best practices"
          git push origin HEAD:main
