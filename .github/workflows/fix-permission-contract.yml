name: Fix permission contract
on:
  push:
    paths:
      - scripts/fix-permission-contract.mjs
      - .github/workflows/fix-permission-contract.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply permission repair
        run: node scripts/fix-permission-contract.mjs
      - name: Permission regression tests
        run: node scripts/test-permission-contract.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit repaired contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx src/app/permissions.ts src/lib/api.ts supabase/functions/admin-provision/index.ts supabase/migrations/20260902233500_unify_permission_contract.sql scripts/test-permission-contract.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: unify permission enforcement"
          git restore scripts/fix-permission-contract.mjs
          git pull --rebase origin main
          git push origin main
