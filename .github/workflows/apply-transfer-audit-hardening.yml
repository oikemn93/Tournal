name: Apply transfer audit hardening
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-transfer-audit-hardening.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python tools/patch_transfer_audit.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts src/app/screens/TransfersView.tsx src/app/types.ts src/app/constants.ts src/app/App.tsx
          git diff --cached --quiet || git commit -m "fix: harden transfer workflow and permissions"
          git push
# rerun 2
