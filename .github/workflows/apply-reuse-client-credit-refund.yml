name: Reuse canonical client credit refund RPC
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-reuse-client-credit-refund.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/patch_reuse_existing_client_credit_refund.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts
          git diff --cached --quiet || git commit -m "refactor: reuse canonical client credit refund RPC"
          git push
