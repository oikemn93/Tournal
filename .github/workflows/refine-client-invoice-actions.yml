name: Refine client invoice actions
on:
  push:
    paths:
      - scripts/refine-client-invoice-actions.mjs
      - scripts/test-client-invoice-actions.mjs
      - .github/workflows/refine-client-invoice-actions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused UI/print repair
        run: node scripts/refine-client-invoice-actions.mjs
      - name: Focused regression tests
        run: node scripts/test-client-invoice-actions.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit repaired sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/ClientsView.tsx src/app/screens/POSView.tsx scripts/test-client-invoice-actions.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: simplify client invoice actions and print express receipts"
          git pull --rebase origin main
          git push origin main
