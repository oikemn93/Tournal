name: Replay fix temporary

on:
  push:
    branches: ["fix/supplier-ledger-consistency"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-ledger-consistency
      - name: Omit production-only paid-charge repair from clean replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/audit/replay-migrations/20260906161544_supplier_ledger_single_source_of_truth.sql')
          s = p.read_text()
          block = """lock table public.charges in access exclusive mode;\nalter table public.charges disable trigger charges_require_disbursement;\nupdate public.charges\nset paid_amount = montant,\n    updated_at = now()\nwhere source = 'manual'\n  and status = 'paid'\n  and paid_amount = 0\n  and montant > 0;\nalter table public.charges enable trigger charges_require_disbursement;"""
          replacement = "-- Production-only legacy paid-charge normalization omitted from clean schema replay."
          if block not in s:
              if replacement in s:
                  raise SystemExit(0)
              raise SystemExit('expected production-only repair block not found')
          p.write_text(s.replace(block, replacement, 1))
          PY
          ! grep -n '^lock table public.charges in access exclusive mode' .github/audit/replay-migrations/20260906161544_supplier_ledger_single_source_of_truth.sql
      - name: Commit replay correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/audit/replay-migrations/20260906161544_supplier_ledger_single_source_of_truth.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: omit production-only charge repair from replay"
          git push origin HEAD:fix/supplier-ledger-consistency
