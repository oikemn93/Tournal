name: Stabilize sales regressions
on:
  push:
    paths:
      - scripts/stabilize-sales-regressions.mjs
      - scripts/test-sales-regressions.mjs
      - supabase/migrations/20260902235500_stabilize_sales_stock_regressions.sql
      - .github/workflows/stabilize-sales-regressions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted regression repair
        run: node scripts/stabilize-sales-regressions.mjs
      - name: Regression contract tests
        run: node scripts/test-sales-regressions.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit repaired sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/POSView.tsx src/app/screens/ClientsView.tsx supabase/functions/create-invoice-share/index.ts supabase/migrations/20260902235500_stabilize_sales_stock_regressions.sql scripts/test-sales-regressions.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: stabilize sales stock and cancellation flows"
          git restore scripts/stabilize-sales-regressions.mjs
          git pull --rebase origin main
          git push origin main
