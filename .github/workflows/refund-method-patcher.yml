name: Refund method patcher

on:
  push:
    branches:
      - feature/superadmin-user-control-20260819
    paths:
      - scripts/refund_method_patch.py
      - .github/workflows/refund-method-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superadmin-user-control-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/refund_method_patch.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tournal refund patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "feat: record refund payment method"
          git push origin HEAD:feature/superadmin-user-control-20260819
