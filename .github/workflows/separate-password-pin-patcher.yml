name: Separate password and quick PIN patch

on:
  push:
    branches:
      - feature/separate-password-pin-20260820
    paths:
      - scripts/separate_password_pin_patch.py
      - .github/workflows/separate-password-pin-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/separate-password-pin-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/separate_password_pin_patch.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tournal activation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx src/lib/api.ts supabase/functions/admin-provision/index.ts
          git commit -m "feat: separate auth password from quick PIN"
          git push origin HEAD:feature/separate-password-pin-20260820
