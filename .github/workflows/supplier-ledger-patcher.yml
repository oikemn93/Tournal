name: Supplier ledger patcher

on:
  push:
    branches: ["fix/supplier-ledger-consistency"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-ledger-consistency
      - name: Apply deterministic supplier ledger patch
        run: python .github/scripts/apply-supplier-ledger-fix-v2.py
      - name: Verify supplier ledger contract
        run: node scripts/test-supplier-ledger-contract.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts .github/audit
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: unify supplier ledger amounts"
          git push origin HEAD:fix/supplier-ledger-consistency
