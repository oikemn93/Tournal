name: Apply return v2 final polish
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-return-v2-final.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/patch_return_v2_final.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/RapportView.tsx src/app/screens/StockView.tsx src/app/screens/POSView.tsx src/app/screens/FacturesView.tsx
          git diff --cached --quiet || git commit -m "fix: finish return v2 accounting polish"
          git push
