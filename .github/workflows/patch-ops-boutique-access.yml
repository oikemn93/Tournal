name: Patch Ops boutique access
on:
  push:
    branches: [fix/deep-audit-regression-hardening-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deep-audit-regression-hardening-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-ops-boutique-access.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Tournal Ops boutique entry"
          git push
