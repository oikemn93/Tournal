name: Temporary SuperAdmin boutique switcher patch
on:
  push:
    branches: [fix/superadmin-boutique-switcher]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/superadmin-boutique-switcher
          fetch-depth: 0
      - name: Patch SuperAdmin boutique switcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/App.tsx')
          s=p.read_text()
          old='''  if (screen==="boutique-select"&&currentUser) return (\n    <BoutiqueSelectScreen\n      user={currentUser} boutiques={boutiques} assignments={currentUser.assignments}\n      groupes={groupes} allUsers={platformUsers}\n      onSelect={handleSelectBoutique} onLogout={handleLogout}\n      onBack={activeBoutiqueId ? ()=>setScreen("app") : undefined}\n    />\n  );'''
          new='''  if (screen==="boutique-select"&&currentUser) {\n    // SuperAdmin access is global and must not depend on per-boutique assignments.\n    // These synthetic assignments exist only in the picker; nothing is persisted.\n    const pickerAssignments: BoutiqueAssignment[] = currentUser.isSuperAdmin\n      ? boutiques.map(b=>({\n          boutiqueId:b.id, role:"Propriétaire",\n          droits:{ dashboard:true, stock:true, fournisseurs:true, clients:true, factures:true, remboursement:true, charges:true, compta:true, vente:true, inventaire:true, marges:true, encaissement_vente:true, annulation_commande:true, decaissement:true, transferts:true },\n        }))\n      : currentUser.assignments;\n    return (\n      <BoutiqueSelectScreen\n        user={currentUser} boutiques={boutiques} assignments={pickerAssignments}\n        groupes={groupes} allUsers={platformUsers}\n        onSelect={currentUser.isSuperAdmin ? (selectedBoutique)=>handleEnterBoutiqueAsAdmin(selectedBoutique) : handleSelectBoutique}\n        onLogout={handleLogout}\n        onBack={activeBoutiqueId ? ()=>setScreen("app") : undefined}\n      />\n    );\n  }'''
          if s.count(old)!=1:
              raise SystemExit(f'expected boutique-select block once, found {s.count(old)}')
          p.write_text(s.replace(old,new))

          t=Path('scripts/test-superadmin-boutique-switcher.mjs')
          t.write_text('''import fs from "node:fs";\nimport assert from "node:assert/strict";\nconst app=fs.readFileSync("src/app/App.tsx","utf8");\nassert.ok(app.includes("currentUser.isSuperAdmin\\n      ? boutiques.map"), "SuperAdmin picker must enumerate every boutique");\nassert.ok(app.includes("assignments={pickerAssignments}"), "Boutique picker must use the SuperAdmin-aware assignments");\nassert.ok(app.includes("onSelect={currentUser.isSuperAdmin ? (selectedBoutique)=>handleEnterBoutiqueAsAdmin(selectedBoutique) : handleSelectBoutique}"), "SuperAdmin picker must use privileged boutique entry path");\nassert.ok(app.includes("onClick={()=>setScreen(\\\"boutique-select\\\")}"), "Boutique header switch button must remain available inside a boutique");\nconsole.log("SuperAdmin boutique switcher contract OK");\n''')
          PY
          node scripts/test-superadmin-boutique-switcher.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx scripts/test-superadmin-boutique-switcher.mjs
          git commit -m "fix: allow superadmin to switch across all boutiques"
          git push origin HEAD:fix/superadmin-boutique-switcher
