name: Mobile Push Button Patcher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/mobile-push-button-state-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/mobile_push_button_patch.py
      - name: Commit patched source if needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make mobile push state actionable"
          git push
