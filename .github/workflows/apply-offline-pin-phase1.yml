name: Apply offline PIN Phase 1

on:
  push:
    branches: [feat/offline-pin-unlock-phase1]
    paths:
      - scripts/apply-offline-pin-phase1.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/offline-pin-unlock-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply offline PIN integration
        run: node scripts/apply-offline-pin-phase1.mjs
      - name: Verify offline auth/PIN contract
        run: node scripts/test-offline-auth-session-contract.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No integration patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/api.ts scripts/test-offline-auth-session-contract.mjs
          git commit -m 'feat: enable session-scoped offline PIN unlock'
          git push origin HEAD:feat/offline-pin-unlock-phase1
