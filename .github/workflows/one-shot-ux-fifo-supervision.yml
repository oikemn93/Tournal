name: One-shot UX FIFO supervision patch
on:
  push:
    branches: [feat/ux-fifo-audit-supervision]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-fifo-audit-supervision
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p=Path(path); s=p.read_text(); n=fn(s)
              if n==s: print('no change', path)
              else: p.write_text(n); print('changed', path)

          edit('src/app/screens/DashboardView.tsx', lambda s:s.replace('useState<Period>("7d")','useState<Period>("day")'))

          def clients(s):
              s=s.replace('const [search, setSearch] = useState("");','const [search, setSearch] = useState("");\n  const [sortBy, setSortBy] = useState<"name"|"revenue"|"due"|"last">("name");',1)
              old='const filtered = clients.filter(c=>c.type===tab&&(c.nom.toLowerCase().includes(search.toLowerCase())||c.tel.includes(search)||c.ville.toLowerCase().includes(search.toLowerCase())));'
              new='''const clientRevenue = (clientId:number) => boutique.invoices.filter(inv=>inv.clientId===clientId&&inv.status!=="annulée"&&inv.type.toLowerCase()!=="retour").reduce((sum,inv)=>sum+Number(inv.montant||0),0);\n  const clientDue = (clientId:number) => boutique.invoices.filter(inv=>inv.clientId===clientId&&inv.status!=="annulée"&&inv.type.toLowerCase()!=="retour").reduce((sum,inv)=>sum+clientInvoiceRemainingAmount(inv),0);\n  const clientLastTransaction = (clientId:number) => Math.max(0,...boutique.invoices.filter(inv=>inv.clientId===clientId).map(inv=>Date.parse(inv.dateRaw??inv.date)||0));\n  const filtered = clients.filter(c=>c.type===tab&&(c.nom.toLowerCase().includes(search.toLowerCase())||c.tel.includes(search)||c.ville.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>sortBy==="revenue"?clientRevenue(b.id)-clientRevenue(a.id):sortBy==="due"?clientDue(b.id)-clientDue(a.id):sortBy==="last"?clientLastTransaction(b.id)-clientLastTransaction(a.id):a.nom.localeCompare(b.nom,"fr",{sensitivity:"base"}));'''
              s=s.replace(old,new)
              needle='<div className="relative"><Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Chercher un client…" className={searchInputCls+" pl-9"}/></div>'
              repl=needle+'\n      <div className="flex justify-end"><label className="text-xs font-bold text-muted-foreground flex items-center gap-2">Trier par <select aria-label="Tri des clients" value={sortBy} onChange={e=>setSortBy(e.target.value as typeof sortBy)} className="rounded-xl border border-border bg-card px-3 py-2 text-xs font-bold text-foreground"><option value="name">Nom</option><option value="revenue">CA cumulé</option><option value="due">Montant dû</option><option value="last">Dernière transaction</option></select></label></div>'
              return s.replace(needle,repl)
          edit('src/app/screens/ClientsView.tsx', clients)

          def report(s):
              s=s.replace('className="sticky top-2 z-30 overflow-visible rounded-2xl border border-border bg-background/95 shadow-sm backdrop-blur"','className="overflow-visible rounded-2xl border border-border bg-background shadow-sm"')
              s=s.replace('<div className="flex gap-1 overflow-x-auto rounded-xl bg-muted/70 p-1">{periodBtns.map', '<div className="sticky top-2 z-30 flex gap-1 overflow-x-auto rounded-xl border border-border bg-background/95 p-1 shadow-sm backdrop-blur">{periodBtns.map')
              s=s.replace('ligne(s) sans coût fiable','ligne(s) sans traçabilité stock exploitable')
              return s
          edit('src/app/screens/RapportViewV2.tsx', report)
          edit('src/app/screens/DashboardView.tsx', lambda s:s.replace('ligne(s) sans coût fiable','ligne(s) sans traçabilité stock exploitable'))

          def stock(s):
              marker='logAction("Réception corrigée"'
              # after successful correction, return to originating supplier when correction was opened from supplier detail
              if 'onReceiptSaved?.(original.supplierId' not in s:
                  s=s.replace('setEditingEntryId(null);\n    } catch (error)', 'setEditingEntryId(null);\n      if (original.supplierId) onReceiptSaved?.(original.supplierId);\n    } catch (error)',1)
              return s
          edit('src/app/screens/StockView.tsx', stock)

          def api(s):
              anchor='''async function dataRpc<T>(name: string, params: Record<string, unknown>): Promise<T> {\n  return dataRequest<T>(`rpc/${name}`, {\n    method: "POST",\n    body: JSON.stringify(params),\n  });\n}\n'''
              add=anchor+'''\nexport type TechnicalLog = { id:number; user_id?:string|null; level:"error"|"warn"|"info"; category:string; message:string; detail?:string|null; context?:Record<string,unknown>; created_at:string };\nexport async function recordTechLog(params:{boutiqueId:string;level:"error"|"warn"|"info";category:"rpc"|"loading"|"sync"|"printing"|"network"|"session"|"other";message:string;detail?:string;context?:Record<string,unknown>}) {\n  return dataRpc<number>("record_tech_log",{p_boutique_id:params.boutiqueId,p_level:params.level,p_category:params.category,p_message:params.message,p_detail:params.detail??null,p_context:params.context??{}});\n}\nexport async function loadTechLogs(boutiqueId:string, limit=200) {\n  return dataRpc<TechnicalLog[]>("get_tech_logs",{p_boutique_id:boutiqueId,p_limit:limit});\n}\n'''
              if 'export type TechnicalLog' not in s: s=s.replace(anchor,add)
              return s
          edit('src/lib/api.ts', api)

          def app(s):
              s=s.replace('type LegacyBoutiqueChange } from "../lib/api";','type LegacyBoutiqueChange, recordTechLog, loadTechLogs } from "../lib/api";')
              old='''async function logTech(boutiqueId: string, entry: Omit<TechLog,"id"|"ts">) {\n  // Browser diagnostics must not become a hidden second persistence system.\n  // Durable user-visible activity is written to public.audit_log instead.\n  console[entry.level === "error" ? "error" : entry.level === "warn" ? "warn" : "info"](\n    `[${boutiqueId}] ${entry.cat}: ${entry.msg}`,\n    entry.detail,\n  );\n}'''
              new='''async function logTech(boutiqueId: string, entry: Omit<TechLog,"id"|"ts">) {\n  console[entry.level === "error" ? "error" : entry.level === "warn" ? "warn" : "info"](`[${boutiqueId}] ${entry.cat}: ${entry.msg}`, entry.detail);\n  const category = entry.cat === "sync" ? "sync" : entry.cat === "session" ? "session" : entry.cat === "pdf" || entry.cat === "qz" ? "printing" : entry.cat === "backend" ? "rpc" : "other";\n  try { await recordTechLog({ boutiqueId, level:entry.level, category, message:entry.msg, detail:entry.detail }); } catch (error) { console.warn("Journal technique distant indisponible", error); }\n}'''
              s=s.replace(old,new)
              oldeff='''  useEffect(() => {\n    // Legacy diagnostic events were intentionally removed. Operational logs\n    // live server-side; this panel only reflects the current client health.\n    setLogs([]);\n    setLoading(false);\n  }, [boutique.id]);'''
              neweff='''  useEffect(() => {\n    let cancelled=false; setLoading(true);\n    void loadTechLogs(boutique.id,200).then(rows=>{if(cancelled)return;setLogs(rows.map(row=>({id:String(row.id),ts:Date.parse(row.created_at),level:row.level,cat:(row.category as TechLogCat),msg:row.message,detail:row.detail??undefined})));}).catch(error=>{console.warn("Supervision technique indisponible",error);if(!cancelled)setLogs([]);}).finally(()=>{if(!cancelled)setLoading(false);});\n    return()=>{cancelled=true;};\n  }, [boutique.id]);'''
              s=s.replace(oldeff,neweff)
              s=s.replace('type TechLogCat   = "sync"|"email"|"pdf"|"qz"|"session"|"backend";','type TechLogCat   = "sync"|"email"|"pdf"|"qz"|"session"|"backend"|"rpc"|"loading"|"printing"|"network"|"other";')
              s=s.replace('const [auditFilter, setAuditFilter] = useState("all");','const [auditFilter, setAuditFilter] = useState("all");\n  const [auditTypeFilter,setAuditTypeFilter]=useState("all");\n  const [auditPeriodDays,setAuditPeriodDays]=useState("30");')
              oldfilter='const filteredAudit=auditFilter==="all"?auditLog:auditLog.filter(e=>e.userId===auditFilter);'
              newfilter='''const auditType=(action:string)=>/annul|supprim|droit|permission|rôle|mot de passe|code/i.test(action)?"sensitive":/stock|réception|inventaire|transfert/i.test(action)?"stock":/encaisse|versement|paiement|règlement/i.test(action)?"payment":/vente|commande|facture|retour/i.test(action)?"sales":"other";\n  const filteredAudit=auditLog.filter(e=>(auditFilter==="all"||e.userId===auditFilter)&&(auditTypeFilter==="all"||auditType(e.action)===auditTypeFilter)&&(auditPeriodDays==="all"||e.timestamp>=Date.now()-Number(auditPeriodDays)*86400000));'''
              s=s.replace(oldfilter,newfilter)
              needle='''          <div className="flex gap-2" style={{ overflowX:"auto", scrollbarWidth:"none" }}>'''
              controls='''          <div className="grid grid-cols-2 gap-2"><select aria-label="Type d’action" value={auditTypeFilter} onChange={e=>setAuditTypeFilter(e.target.value)} className={inputCls}><option value="all">Toutes les actions</option><option value="sales">Ventes et retours</option><option value="payment">Encaissements</option><option value="stock">Stock et transferts</option><option value="sensitive">Actions sensibles</option><option value="other">Autres</option></select><select aria-label="Période du journal" value={auditPeriodDays} onChange={e=>setAuditPeriodDays(e.target.value)} className={inputCls}><option value="7">7 jours</option><option value="30">30 jours</option><option value="90">90 jours</option><option value="all">Toute la période</option></select></div>\n'''+needle
              s=s.replace(needle,controls,1)
              s=s.replace('<div className="bg-card rounded-2xl px-3 py-3 border border-border">','<div className="bg-card rounded-2xl px-3 py-3 border" style={{borderColor:auditType(e.action)==="sensitive"?"#ef4444":"var(--border)"}}>',1)
              s=s.replace('<p className="text-sm font-bold">{e.action}</p>','<p className="text-sm font-bold">{e.userNom} · {e.action}</p>',1)
              s=s.replace('<p className="text-xs text-muted-foreground text-right whitespace-nowrap flex-shrink-0">{e.date}</p>','<p className="text-xs text-muted-foreground text-right whitespace-nowrap flex-shrink-0">{fmtDateTime(e.timestamp)}</p>',1)
              # Trace password resets from both controls.
              s=s.replace('await resetUserPassword(pwdModal.userId,pwdVal); toast.success("Mot de passe mis à jour");', 'await resetUserPassword(pwdModal.userId,pwdVal); logAction("Réinitialisation mot de passe",pwdModal.nom,"🔐"); toast.success("Mot de passe mis à jour");')
              return s
          edit('src/app/App.tsx', app)

          migration=Path('supabase/migrations/20260916203000_add_technical_supervision_logs.sql')
          if not migration.exists():
              migration.write_text('''create table if not exists public.tech_logs (\n  id bigint generated by default as identity primary key, boutique_id text not null references public.boutiques(id) on delete cascade, user_id uuid null, level text not null check (level in ('error','warn','info')), category text not null check (category in ('rpc','loading','sync','printing','network','session','other')), message text not null, detail text null, context jsonb not null default '{}'::jsonb, created_at timestamptz not null default now()\n);\ncreate index if not exists tech_logs_boutique_created_idx on public.tech_logs(boutique_id,created_at desc);\nalter table public.tech_logs enable row level security; revoke all on public.tech_logs from public, anon, authenticated;\ncreate or replace function public.record_tech_log(p_boutique_id text,p_level text,p_category text,p_message text,p_detail text default null,p_context jsonb default '{}'::jsonb) returns bigint language plpgsql security definer set search_path='pg_catalog','public','private' as $$ declare v_id bigint; begin if auth.uid() is null or not private.auth_has_boutique_access(p_boutique_id) then raise exception 'forbidden'; end if; if p_level not in ('error','warn','info') or p_category not in ('rpc','loading','sync','printing','network','session','other') then raise exception 'invalid tech log'; end if; insert into public.tech_logs(boutique_id,user_id,level,category,message,detail,context) values(p_boutique_id,auth.uid(),p_level,p_category,left(p_message,500),left(p_detail,4000),coalesce(p_context,'{}'::jsonb)) returning id into v_id; return v_id; end $$;\nrevoke all on function public.record_tech_log(text,text,text,text,text,jsonb) from public,anon; grant execute on function public.record_tech_log(text,text,text,text,text,jsonb) to authenticated;\ncreate or replace function public.get_tech_logs(p_boutique_id text,p_limit integer default 200) returns table(id bigint,user_id uuid,level text,category text,message text,detail text,context jsonb,created_at timestamptz) language plpgsql stable security definer set search_path='pg_catalog','public','private' as $$ begin if auth.uid() is null or not (private.auth_is_super_admin() or exists(select 1 from public.boutique_assignments a where a.boutique_id=p_boutique_id and a.user_id=auth.uid() and a.role='owner')) then raise exception 'forbidden'; end if; return query select t.id,t.user_id,t.level,t.category,t.message,t.detail,t.context,t.created_at from public.tech_logs t where t.boutique_id=p_boutique_id order by t.created_at desc limit greatest(1,least(coalesce(p_limit,200),500)); end $$;\nrevoke all on function public.get_tech_logs(text,integer) from public,anon; grant execute on function public.get_tech_logs(text,integer) to authenticated;\n''')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src supabase/migrations
          git diff --cached --quiet && exit 0
          git commit -m "feat: improve UX audit and technical supervision"
          git push origin HEAD:feat/ux-fifo-audit-supervision
