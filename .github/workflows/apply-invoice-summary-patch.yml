name: Apply invoice summary patch

on:
  push:
    branches: [perf/bulk-invoice-line-aggregation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bulk-invoice-line-aggregation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align deterministic source anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/apply-invoice-summary-patch.mjs')
          text=path.read_text()
          old="""  text = replaceCount(text,
    'getLastSalePrice(lPid, invoices, effectiveUnit)',
    'getLastSalePrice(lPid, invoices, effectiveUnit, boutique.salePriceHints)',
    1,
    'Factures line last price');
"""
          new="""  text = replaceCount(text,
    'getLastSalePrice(first.id,invoices,unit)',
    'getLastSalePrice(first.id,invoices,unit,boutique.salePriceHints)',
    1,
    'Factures floating button last price');
  text = replaceCount(text,
    'getLastSalePrice(prod.id,invoices,unit)',
    'getLastSalePrice(prod.id,invoices,unit,boutique.salePriceHints)',
    1,
    'Factures product last price');
  text = replaceCount(text,
    'getLastSalePrice(lPid,invoices,u)',
    'getLastSalePrice(lPid,invoices,u,boutique.salePriceHints)',
    1,
    'Factures unit last price');
"""
          if text.count(old) != 1:
              raise SystemExit('price anchor repair target not unique')
          path.write_text(text.replace(old,new))
          PY
      - name: Apply deterministic patch
        run: node .github/scripts/apply-invoice-summary-patch.mjs
      - name: Validate patch syntax
        run: |
          git diff --check
          node scripts/test-performance-read-contract.mjs
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: split invoice summaries from line hydration'
          git push origin HEAD:perf/bulk-invoice-line-aggregation
