name: Apply invoice summary patch v2

on:
  push:
    branches:
      - perf/bulk-invoice-line-aggregation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bulk-invoice-line-aggregation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch v2
        run: node .github/scripts/apply-invoice-summary-patch-v2.mjs
      - name: Validate focused contracts
        run: |
          git diff --check
          node scripts/test-performance-read-contract.mjs
          node scripts/test-invoice-summary-contract.mjs
      - name: Restore workflow files for token permissions
        run: |
          git checkout HEAD -- .github/workflows/ci.yml
          git checkout HEAD -- .github/workflows/apply-invoice-summary-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: split invoice summaries from line hydration'
          git push origin HEAD:perf/bulk-invoice-line-aggregation
