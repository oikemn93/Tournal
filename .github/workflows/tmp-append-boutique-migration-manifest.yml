name: Temporary boutique migration manifest patch
on:
  push:
    branches: [fix/boutique-creation-id-default]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boutique-creation-id-default
          fetch-depth: 0
      - name: Append remote migration manifest
        run: |
          line='20260909201929|generate_boutique_ids_by_default'
          grep -Fxq "$line" .github/audit/remote-migration-manifest.txt || echo "$line" >> .github/audit/remote-migration-manifest.txt
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/audit/remote-migration-manifest.txt
          git diff --cached --quiet || git commit -m "audit: record boutique id default migration"
          git push origin HEAD:fix/boutique-creation-id-default
