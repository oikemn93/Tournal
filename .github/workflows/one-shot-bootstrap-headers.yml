name: One-shot bootstrap header preservation
on:
  push:
    paths: ['.github/workflows/one-shot-bootstrap-headers.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/api.ts'); s=p.read_text()
          s=s.replace('const [boutiques, categories, products, entries, clients, suppliers, invoices, payments, advances, creditRefunds, charges, sessions, auditLogs, userScope] = await Promise.all([', 'const [boutiques, categories, products, entries, clients, suppliers, invoices, historicalInvoiceHeaders, payments, advances, creditRefunds, charges, sessions, auditLogs, userScope] = await Promise.all([',1)
          anchor='''      dataRequest<any[]>(`invoices?select=*,invoice_lines(*)${scoped()}${invoiceWindow}&order=invoice_date.desc`),\n      dataRequest<any[]>(`invoice_payments?select=*${scoped()}${paymentWindow}&order=paid_at.asc`),'''
          repl='''      dataRequest<any[]>(`invoices?select=*,invoice_lines(*)${scoped()}${invoiceWindow}&order=invoice_date.desc`),\n      (options.historyOnly ? Promise.resolve([]) : dataRequest<any[]>(`invoices?select=*${scoped()}&invoice_date=lt.${encodeURIComponent(historyFrom)}&order=invoice_date.desc`)),\n      dataRequest<any[]>(`invoice_payments?select=*${scoped()}${paymentWindow}&order=paid_at.asc`),'''
          if anchor not in s: raise SystemExit('invoice promise anchor missing')
          s=s.replace(anchor,repl,1)
          s=s.replace('invoices: invoices.filter(i => i.boutique_id === b.id).map(i => {', 'invoices: [...invoices, ...historicalInvoiceHeaders].filter(i => i.boutique_id === b.id).map(i => {',1)
          p.write_text(s)
          p=Path('src/app/screens/FacturesView.tsx'); s=p.read_text()
          s=s.replace('{historyLoadingDay===selectedDay ? "Chargement…" : dayFilterActive ? dayLabel : "30 derniers jours"}', '{historyLoadingDay===selectedDay ? "Chargement…" : dayFilterActive ? dayLabel : "Toutes les factures"}',1)
          p.write_text(s)
          PY
      - run: pnpm build
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/api.ts src/app/screens/FacturesView.tsx
          git commit -m 'perf: keep historical invoice headers lightweight' || exit 0
          git push
