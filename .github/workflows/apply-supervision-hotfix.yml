name: Apply supervision hotfix

on:
  push:
    branches: [fix/supervision-typescript-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supervision-typescript-runtime
      - name: Patch supervision source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/App.tsx')
          s = p.read_text()
          old_labels = 'const CAT_LABEL: Record<TechLogCat,string>  = { sync:"Sync", email:"Email", pdf:"PDF", qz:"QZ Tray", session:"Session", backend:"Backend" };\nconst CAT_COLOR: Record<TechLogCat,string>  = { sync:"#3b82f6", email:"#f59e0b", pdf:"#8b5cf6", qz:"#06b6d4", session:"#10b981", backend:"#ef4444" };'
          new_labels = 'const CAT_LABEL: Record<TechLogCat,string>  = { sync:"Sync", email:"Email", pdf:"PDF", qz:"QZ Tray", session:"Session", backend:"Backend", rpc:"RPC", loading:"Chargement", printing:"Impression", network:"Réseau", other:"Autre" };\nconst CAT_COLOR: Record<TechLogCat,string>  = { sync:"#3b82f6", email:"#f59e0b", pdf:"#8b5cf6", qz:"#06b6d4", session:"#10b981", backend:"#ef4444", rpc:"#6366f1", loading:"#64748b", printing:"#8b5cf6", network:"#0ea5e9", other:"#6b7280" };'
          old_border = '<div className="bg-card rounded-2xl px-3 py-3 border" style={{borderColor:auditType(e.action)==="sensitive"?"#ef4444":"var(--border)"}}>'
          new_border = '<div className="bg-card rounded-2xl px-3 py-3 border border-border">'
          if s.count(old_labels) != 1:
              raise SystemExit(f'expected one incomplete tech-log map, found {s.count(old_labels)}')
          if s.count(old_border) != 1:
              raise SystemExit(f'expected one invalid supervision border, found {s.count(old_border)}')
          s = s.replace(old_labels, new_labels).replace(old_border, new_border)
          p.write_text(s)
          PY
          rm .github/workflows/apply-supervision-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx .github/workflows/apply-supervision-hotfix.yml
          git commit -m 'fix: restore supervision runtime and TypeScript safety'
          git push origin HEAD:fix/supervision-typescript-runtime
