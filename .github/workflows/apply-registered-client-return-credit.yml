name: Apply registered client return credit flow
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-registered-client-return-credit.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/patch_registered_client_return_credit.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts src/app/screens/ClientsView.tsx
          git diff --cached --quiet || git commit -m "feat: defer registered client return refunds to credit"
          git push
