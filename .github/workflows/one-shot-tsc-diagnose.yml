name: One-shot TSC diagnose
on:
  push:
    branches: [feat/ux-fifo-audit-supervision]
permissions: {contents: write}
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/ux-fifo-audit-supervision}
      - uses: pnpm/action-setup@v4
        with: {version: 10.13.1}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          pnpm exec tsc --noEmit > tsc-errors.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tsc-errors.txt
          git commit -m 'chore: capture tsc diagnostics' || exit 0
          git push origin HEAD:feat/ux-fifo-audit-supervision
