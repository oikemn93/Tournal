name: Apply sale stock and client margin
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-sale-stock-client-margin.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/patch_sale_stock_and_client_margin.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/POSView.tsx src/app/screens/FacturesView.tsx src/app/screens/ClientsView.tsx src/lib/inventoryApi.ts
          git diff --cached --quiet || git commit -m "fix: prevent transient double stock and show invoice FIFO margin"
          git push
