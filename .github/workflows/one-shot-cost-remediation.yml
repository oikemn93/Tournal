name: One-shot cost remediation UI
on:
  push:
    branches: [feat/ux-fifo-audit-supervision]
permissions: {contents: write}
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/ux-fifo-audit-supervision}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/api.ts');s=p.read_text();anchor='export async function loadTechLogs(boutiqueId:string, limit=200) {\n  return dataRpc<TechnicalLog[]>("get_tech_logs",{p_boutique_id:boutiqueId,p_limit:limit});\n}\n'
          add=anchor+'\nexport type MissingStockCost = { entry_id:number; product_id:number; product_name:string; qty:number; entry_date:string; supplier_name?:string|null; reference?:string|null };\nexport async function loadMissingStockCosts(boutiqueId:string) { return dataRpc<MissingStockCost[]>("get_missing_stock_costs",{p_boutique_id:boutiqueId}); }\nexport async function setStockEntryReferenceCost(boutiqueId:string,entryId:number,unitCost:number) { return dataRpc<void>("set_stock_entry_reference_cost",{p_boutique_id:boutiqueId,p_entry_id:entryId,p_unit_cost:unitCost}); }\n'
          if 'MissingStockCost' not in s:s=s.replace(anchor,add)
          p.write_text(s)
          p=Path('src/app/screens/StockView.tsx');s=p.read_text();s=s.replace('setProductActive, updateProduct } from "../../lib/api";','setProductActive, updateProduct, loadMissingStockCosts, setStockEntryReferenceCost, type MissingStockCost } from "../../lib/api";')
          s=s.replace('export function StockView({ boutique, onUpdate, logAction, canSeeMargin, initialFilter, initialSupplierId, initialEntryId, onInitialRoutePrepared, onReceiptSaved }: {','export function StockView({ boutique, onUpdate, logAction, canSeeMargin, canManageReferenceCosts=false, initialFilter, initialSupplierId, initialEntryId, onInitialRoutePrepared, onReceiptSaved }: {')
          s=s.replace('  canSeeMargin: boolean;','  canSeeMargin: boolean;\n  canManageReferenceCosts?: boolean;',1)
          needle='  const [sortBy, setSortBy] = useState<"nom"|"qty"|"valeur">("nom");'
          s=s.replace(needle,needle+'\n  const [missingCosts,setMissingCosts]=useState<MissingStockCost[]>([]);\n  const [costDrafts,setCostDrafts]=useState<Record<number,string>>({});\n  const [costSaving,setCostSaving]=useState<number|null>(null);')
          marker='  const supplierById = (supplierId?: number|null) => suppliers.find(s => s.id === supplierId);'
          extra='''  useEffect(()=>{ if(!canManageReferenceCosts){setMissingCosts([]);return;} let cancelled=false; void loadMissingStockCosts(boutique.id).then(rows=>{if(!cancelled)setMissingCosts(rows);}).catch(()=>{if(!cancelled)setMissingCosts([]);}); return()=>{cancelled=true;}; },[boutique.id,canManageReferenceCosts]);\n  async function saveMissingCost(row:MissingStockCost){const value=Number(costDrafts[row.entry_id]);if(!Number.isFinite(value)||value<=0)return;setCostSaving(row.entry_id);try{await setStockEntryReferenceCost(boutique.id,row.entry_id,value);setMissingCosts(current=>current.filter(item=>item.entry_id!==row.entry_id));logAction("Prix d'achat historique complété",`${row.product_name} · réception #${row.entry_id} · ${fmt(value)}/unité`,"🧾");}catch(error){alert(error instanceof Error?error.message:"Mise à jour impossible");}finally{setCostSaving(null);}}\n\n'''+marker
          s=s.replace(marker,extra)
          # insert remediation card at top-level return before stock toolbar, using first stable root occurrence
          root='<div className="space-y-4 pb-24" data-screen-source="relational-stock">'
          card='''<div className="space-y-4 pb-24" data-screen-source="relational-stock">\n      {canManageReferenceCosts&&missingCosts.length>0&&<div className="rounded-2xl border border-amber-300 bg-amber-50 p-4 space-y-3"><div><p className="text-sm font-black text-amber-900">Prix d’achat à compléter · {missingCosts.length}</p><p className="text-xs text-amber-800 mt-1">Saisissez uniquement le coût réel de la réception. Tournal ne calcule ni moyenne ni estimation.</p></div>{missingCosts.slice(0,12).map(row=><div key={row.entry_id} className="grid grid-cols-[1fr_110px_auto] gap-2 items-center"><div className="min-w-0"><p className="text-xs font-black truncate">{row.product_name}</p><p className="text-[10px] text-muted-foreground">{new Date(row.entry_date).toLocaleDateString("fr-FR")} · {row.qty} · #{row.entry_id}</p></div><input aria-label={`Prix d'achat ${row.product_name}`} inputMode="decimal" value={costDrafts[row.entry_id]??""} onChange={e=>setCostDrafts(current=>({...current,[row.entry_id]:e.target.value}))} placeholder="F / unité" className="rounded-lg border border-amber-300 bg-white px-2 py-2 text-xs"/><button type="button" disabled={costSaving===row.entry_id} onClick={()=>void saveMissingCost(row)} className="rounded-lg bg-amber-700 px-3 py-2 text-xs font-black text-white disabled:opacity-50">Valider</button></div>)}</div>}'''
          if root in s:s=s.replace(root,card,1)
          p.write_text(s)
          p=Path('src/app/App.tsx');s=p.read_text();s=s.replace('canSeeMargin={canSeeMargin} onUpdate={updateBoutique}', 'canSeeMargin={canSeeMargin} canManageReferenceCosts={isOwner || !!currentUser?.isSuperAdmin} onUpdate={updateBoutique}',1);p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet || (git commit -m 'feat: add owner workflow for missing purchase costs' && git push origin HEAD:feat/ux-fifo-audit-supervision)
