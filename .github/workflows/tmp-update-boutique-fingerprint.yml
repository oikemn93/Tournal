name: Temporary boutique fingerprint patch
on:
  push:
    branches: [fix/boutique-creation-id-default]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boutique-creation-id-default
          fetch-depth: 0
      - name: Update expected production column fingerprint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/audit/schema-fingerprint.sql')
          s=p.read_text()
          old="('columns',     639, '1f4fc9b2f7b25f05bddb6a03fff155e2')"
          new="('columns',     639, 'c0d9e7b93f5aee43a9920f749653c7cf')"
          if s.count(old) != 1:
              raise SystemExit(f'expected old columns fingerprint once, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/audit/schema-fingerprint.sql
          git commit -m "audit: update production column fingerprint"
          git push origin HEAD:fix/boutique-creation-id-default
