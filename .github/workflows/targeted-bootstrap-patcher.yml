name: Targeted bootstrap patcher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'perf/auth-bootstrap-targeted-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize one-shot patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/targeted_bootstrap_patch.py')
          s=p.read_text()
          start=s.index("# Keep the app chrome visible while targeted business data hydrates.\n")
          marker="loading_overlay = '''"
          mid=s.index(marker,start)
          # Drop the ambiguous parent-class replacement; a fixed overlay does not need it.
          s=s[:start]+"# Keep the app chrome visible while targeted business data hydrates.\n"+s[mid:]
          s=s.replace('loading_overlay = \'\'\'      {businessLoading && <div className="absolute ', 'loading_overlay = \'\'\'      {businessLoading && <div className="fixed ', 1)
          p.write_text(s)
          PY
      - name: Apply guarded patch
        run: python scripts/targeted_bootstrap_patch.py
      - name: Commit patched source if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/lib/api.ts
          git commit -m "perf: split auth bootstrap from boutique hydration"
          git push
