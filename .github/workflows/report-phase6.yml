name: Report Phase 6

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  simplified-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Phase 6 simplified P&L contract
        run: node scripts/test-report-phase6-contract.mjs
      - name: TypeScript contract
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
