name: Realtime coverage patcher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/realtime-coverage-20260821'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
      - name: Apply guarded patch
        run: python scripts/realtime_coverage_patch.py
      - name: Commit patched source if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts src/app/screens/TransfersView.tsx
          git commit -m 'feat: complete realtime client coverage'
          git push
