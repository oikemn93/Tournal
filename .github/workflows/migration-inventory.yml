name: Migration inventory
on:
  push:
    branches: [audit/migration-inventory-20260905]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List local migration blobs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -s 'supabase/migrations/*.sql' | sort -k4
