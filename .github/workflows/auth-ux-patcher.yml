name: Auth UX patcher

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auth_ux_patch.py'
      - '.github/workflows/auth-ux-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ux/auth-flow-smooth-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/auth_ux_patch.py
      - name: Commit patched source if needed
        run: |
          if git diff --quiet -- src/app/App.tsx; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'Tournal UX bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/App.tsx
          git commit -m 'ux: smooth password and quick PIN flow'
          git push origin HEAD:${{ github.head_ref }}
