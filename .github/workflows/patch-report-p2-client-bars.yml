name: Patch Report P2 Client Bars
on:
  push:
    branches: [fix/report-audit-priorities]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-audit-priorities
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-report-p2-client-bars.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/RapportViewV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(report): use absolute client chart widths [P2]"
          git push origin HEAD:fix/report-audit-priorities
