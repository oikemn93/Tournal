name: One-shot supervision TypeScript fix
on:
  push:
    branches: [fix/ci-supervision-log-card-v2]
permissions: {contents: write}
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/ci-supervision-log-card-v2}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/App.tsx')
          s=p.read_text()
          old='style={{borderColor:auditType(e.action)==="sensitive"?"#fecaca":undefined}}'
          new='style={{borderColor:e.level==="error"?"#fecaca":undefined}}'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/one-shot-supervision-tsc.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: restore supervision TypeScript build'
          git push origin HEAD:fix/ci-supervision-log-card-v2
