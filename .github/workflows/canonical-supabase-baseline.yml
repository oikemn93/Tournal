name: Canonical Supabase baseline

on:
  push:
    branches: [audit/migration-inventory-20260905]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify CI credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN is not configured'; exit 2; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'SUPABASE_DB_PASSWORD is not configured'; exit 3; }

      - name: Link production project read-only for schema export
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref cnxtylngddwmhugxkzju

      - name: Export canonical schema-only baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          supabase db dump --linked -f supabase/migrations/20260905190000_canonical_production_baseline.sql
          test -s supabase/migrations/20260905190000_canonical_production_baseline.sql
          echo "baseline_bytes=$(wc -c < supabase/migrations/20260905190000_canonical_production_baseline.sql)"

      - name: Reject obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/20260905190000_canonical_production_baseline.sql'
          if grep -nE 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|eyJhbGciOiJ' "$file"; then
            echo 'Potential secret material detected in baseline.' >&2
            exit 4
          fi

      - name: Replay canonical baseline on a fresh local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase db reset --local --no-seed

      - name: Fingerprint reconstructed application schema
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -At -v ON_ERROR_STOP=1 <<'SQL' > canonical-fingerprint.txt
          with objects as (
            select 'table|'||n.nspname||'.'||c.relname||'|'||c.relkind::text as x
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private') and c.relkind in ('r','p','v','m','S')
            union all
            select 'column|'||table_schema||'.'||table_name||'|'||ordinal_position||'|'||column_name||'|'||data_type||'|'||coalesce(column_default,'')||'|'||is_nullable
            from information_schema.columns where table_schema in ('public','private')
            union all
            select 'constraint|'||n.nspname||'.'||c.relname||'|'||con.conname||'|'||pg_get_constraintdef(con.oid,true)
            from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private')
            union all
            select 'index|'||schemaname||'.'||tablename||'|'||indexname||'|'||indexdef from pg_indexes where schemaname in ('public','private')
            union all
            select 'policy|'||schemaname||'.'||tablename||'|'||policyname||'|'||cmd||'|'||coalesce(qual,'')||'|'||coalesce(with_check,'') from pg_policies where schemaname in ('public','private')
            union all
            select 'function|'||n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')|'||pg_get_functiondef(p.oid)
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private')
            union all
            select 'trigger|'||n.nspname||'.'||c.relname||'|'||t.tgname||'|'||pg_get_triggerdef(t.oid,true)
            from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname in ('public','private') and not t.tgisinternal
          )
          select md5(string_agg(x,E'\n' order by x)), count(*) from objects;
          SQL
          cat canonical-fingerprint.txt

      - name: Upload baseline for audit
        uses: actions/upload-artifact@v4
        with:
          name: canonical-supabase-baseline
          path: |
            supabase/migrations/20260905190000_canonical_production_baseline.sql
            canonical-fingerprint.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
