name: Report Navigation Tabs

on:
  pull_request:
    paths:
      - "src/app/screens/RapportViewV2.tsx"
      - "scripts/test-report-navigation-tabs.mjs"
      - "scripts/test-report-ui-sections-contract.mjs"
      - "scripts/test-report-ui-team-contract.mjs"
      - ".github/workflows/report-navigation-tabs.yml"

jobs:
  report-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-report-navigation-tabs.mjs
      - run: node scripts/test-report-ui-sections-contract.mjs
      - run: node scripts/test-report-ui-team-contract.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
