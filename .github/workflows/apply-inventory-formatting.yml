name: Apply inventory formatting

on:
  push:
    paths:
      - tools/fix_inventory_formatting.py
      - .github/workflows/apply-inventory-formatting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply inventory formatting fix
        run: python3 tools/fix_inventory_formatting.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/screens/InventoryView.tsx
          git commit -m "fix: separate inventory quantities from currency formatting" || exit 0
          git push
