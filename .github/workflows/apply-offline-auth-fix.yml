name: Apply offline auth fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-offline-auth-fix.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted offline auth patch
        run: node scripts/apply-offline-auth-fix.mjs
      - name: Verify offline auth contract
        run: node scripts/test-offline-auth-session-contract.mjs
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api.ts scripts/test-offline-auth-session-contract.mjs
          git commit -m "fix: preserve active auth session while offline"
          git push origin HEAD:main
