name: One-shot fix supplier return and POS duplicates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-supplier-return-pos-duplicates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch supplier return and duplicate sale lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # StockView: report a successful supplier receipt back to the parent.
          p = Path('src/app/screens/StockView.tsx')
          s = p.read_text()
          old = '''export function StockView({ boutique, onUpdate, logAction, initialFilter, initialSupplierId, initialEntryId, onInitialRoutePrepared }: {
            boutique: Boutique; onUpdate: (u: Partial<Boutique>) => void;
            logAction: (action: string, detail: string, icon: string) => void;
            initialFilter?: string;
            initialSupplierId?: number;
            initialEntryId?: number;
            onInitialRoutePrepared?: () => void;
          }) {'''
          new = '''export function StockView({ boutique, onUpdate, logAction, initialFilter, initialSupplierId, initialEntryId, onInitialRoutePrepared, onReceiptSaved }: {
            boutique: Boutique; onUpdate: (u: Partial<Boutique>) => void;
            logAction: (action: string, detail: string, icon: string) => void;
            initialFilter?: string;
            initialSupplierId?: number;
            initialEntryId?: number;
            onInitialRoutePrepared?: () => void;
            onReceiptSaved?: (supplierId: number) => void;
          }) {'''
          if old not in s:
              raise SystemExit('StockView props block not found')
          s = s.replace(old, new, 1)
          old = '''    setDLotMode(false); setDLots("1"); setDPieces(""); setDLongueur("");
              setReceiptSupplierId(null);
            }'''
          new = '''    setDLotMode(false); setDLots("1"); setDPieces(""); setDLongueur("");
              setReceiptSupplierId(null);
              onReceiptSaved?.(supplier.id);
            }'''
          if old not in s:
              raise SystemExit('StockView submitEntry tail not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # FournisseursView: allow the parent to reopen the exact supplier card.
          p = Path('src/app/screens/FournisseursView.tsx')
          s = p.read_text()
          s = s.replace('import React, { useState } from "react";', 'import React, { useEffect, useState } from "react";', 1)
          old = '''export function FournisseursView({ boutique, onUpdate, logAction, canPaySupplier, canManageReceipts, onStartReceipt, onCorrectReceipt, defaultPaymentTermsDays = 30 }: {
            boutique: Boutique; onUpdate: (u: Partial<Boutique>) => void;
            logAction: (action: string, detail: string, icon: string) => void;
            canPaySupplier: boolean; canManageReceipts: boolean;
            onStartReceipt: (supplierId: number) => void;
            onCorrectReceipt: (entry: StockEntry, supplierId: number) => void;
            defaultPaymentTermsDays?: number;
          }) {'''
          new = '''export function FournisseursView({ boutique, onUpdate, logAction, canPaySupplier, canManageReceipts, onStartReceipt, onCorrectReceipt, initialSupplierId, onInitialSupplierOpened, defaultPaymentTermsDays = 30 }: {
            boutique: Boutique; onUpdate: (u: Partial<Boutique>) => void;
            logAction: (action: string, detail: string, icon: string) => void;
            canPaySupplier: boolean; canManageReceipts: boolean;
            onStartReceipt: (supplierId: number) => void;
            onCorrectReceipt: (entry: StockEntry, supplierId: number) => void;
            initialSupplierId?: number;
            onInitialSupplierOpened?: () => void;
            defaultPaymentTermsDays?: number;
          }) {'''
          if old not in s:
              raise SystemExit('FournisseursView props block not found')
          s = s.replace(old, new, 1)
          marker = '  const selectedSupplier = suppliers.find(supplier => supplier.id === selectedSupplierId) ?? null;\n'
          insert = '''  useEffect(() => {
            if (initialSupplierId == null || !suppliers.some(supplier => supplier.id === initialSupplierId)) return;
            setSelectedSupplierId(initialSupplierId);
            onInitialSupplierOpened?.();
          }, [initialSupplierId, suppliers, onInitialSupplierOpened]);

'''
          if marker not in s:
              raise SystemExit('FournisseursView selected supplier marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          # POS: every add action creates a separate sale line, even for the same product.
          p = Path('src/app/screens/POSView.tsx')
          s = p.read_text()
          old = '    setCart(prev => { const ex = prev.find(i => i.productId === addModal.id); if (ex) return prev.map(i => i.productId === addModal.id ? item : i); return [...prev, item]; });'
          new = '    setCart(prev => [...prev, item]);'
          if old not in s:
              raise SystemExit('POS add cart replacement not found')
          s = s.replace(old, new, 1)
          old = '''  function removeFromCart(productId: number) { setCart(prev => prev.filter(i => i.productId !== productId)); }
            function updateCartQty(productId: number, newDispQty: number) {
              if (newDispQty <= 0) { removeFromCart(productId); return; }
              setCart(prev => prev.map(item => {
                if (item.productId !== productId) return item;
                if (item.sellUnit && item.sellQty !== undefined) {
                  const p = products.find(pr => pr.id === productId);
                  const newBase = p ? toBaseQty(newDispQty, item.sellUnit, p) : newDispQty;
                  return { ...item, sellQty: newDispQty, qty: newBase };
                }
                return { ...item, qty: newDispQty };
              }));
            }'''
          new = '''  function removeFromCart(lineIndex: number) { setCart(prev => prev.filter((_, index) => index !== lineIndex)); }
            function updateCartQty(lineIndex: number, newDispQty: number) {
              if (newDispQty <= 0) { removeFromCart(lineIndex); return; }
              setCart(prev => prev.map((item, index) => {
                if (index !== lineIndex) return item;
                if (item.sellUnit && item.sellQty !== undefined) {
                  const p = products.find(pr => pr.id === item.productId);
                  const newBase = p ? toBaseQty(newDispQty, item.sellUnit, p) : newDispQty;
                  return { ...item, sellQty: newDispQty, qty: newBase };
                }
                return { ...item, qty: newDispQty };
              }));
            }'''
          if old not in s:
              raise SystemExit('POS cart mutators block not found')
          s = s.replace(old, new, 1)
          s = s.replace('{cart.map(item => {', '{cart.map((item, lineIndex) => {', 1)
          s = s.replace('<div key={item.productId} className="flex items-center gap-3 bg-muted rounded-2xl p-3">', '<div key={`${item.productId}-${item.prixUnit}-${lineIndex}`} className="flex items-center gap-3 bg-muted rounded-2xl p-3">', 1)
          s = s.replace('onClick={()=>updateCartQty(item.productId, dQty-1)}', 'onClick={()=>updateCartQty(lineIndex, dQty-1)}', 1)
          s = s.replace('onClick={()=>updateCartQty(item.productId, dQty+1)}', 'onClick={()=>updateCartQty(lineIndex, dQty+1)}', 1)
          s = s.replace('onClick={()=>removeFromCart(item.productId)}', 'onClick={()=>removeFromCart(lineIndex)}', 1)
          # The inline product picker remains highlighted, but now communicates the number of lines.
          s = s.replace('const inCart=cart.find(i=>i.productId===p.id);', 'const matchingLines=cart.filter(i=>i.productId===p.id);\n                  const inCart=matchingLines[0];', 1)
          s = s.replace('{inCart&&<p className="text-xs font-bold" style={{ color:POS_COLOR }}>× {inCart.qty} ✓</p>}', '{inCart&&<p className="text-xs font-bold" style={{ color:POS_COLOR }}>{matchingLines.length} ligne{matchingLines.length>1?"s":""} ✓</p>}', 1)
          p.write_text(s)

          # App wiring: after a receipt, go back to the supplier card that launched it.
          p = Path('src/app/App.tsx')
          s = p.read_text()
          old = 'initialEntryId={navFilter.stockEntryId?Number(navFilter.stockEntryId):undefined} onInitialRoutePrepared={()=>setNavFilter({})}/>'
          new = 'initialEntryId={navFilter.stockEntryId?Number(navFilter.stockEntryId):undefined} onInitialRoutePrepared={()=>setNavFilter({})} onReceiptSaved={(supplierId)=>{setNavFilter({supplierDetailId:String(supplierId)});setTab("fournisseurs");}}/>'
          if old not in s:
              raise SystemExit('App StockView wiring not found')
          s = s.replace(old, new, 1)
          old = 'onCorrectReceipt={(entry,supplierId)=>{setNavFilter({supplierId:String(supplierId),stockEntryId:String(entry.id)});setTab("stock");}} defaultPaymentTermsDays={supplierPaymentTermsDays}/>'
          new = 'onCorrectReceipt={(entry,supplierId)=>{setNavFilter({supplierId:String(supplierId),stockEntryId:String(entry.id)});setTab("stock");}} initialSupplierId={navFilter.supplierDetailId?Number(navFilter.supplierDetailId):undefined} onInitialSupplierOpened={()=>setNavFilter({})} defaultPaymentTermsDays={supplierPaymentTermsDays}/>'
          if old not in s:
              raise SystemExit('App FournisseursView wiring not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify invariants
        shell: bash
        run: |
          grep -F 'onReceiptSaved?.(supplier.id)' src/app/screens/StockView.tsx
          grep -F 'initialSupplierId' src/app/screens/FournisseursView.tsx
          grep -F 'setCart(prev => [...prev, item]);' src/app/screens/POSView.tsx
          grep -F 'updateCartQty(lineIndex' src/app/screens/POSView.tsx
          grep -F 'onReceiptSaved={(supplierId)' src/app/App.tsx
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx src/app/screens/StockView.tsx src/app/screens/FournisseursView.tsx src/app/screens/POSView.tsx
          git commit -m 'fix: return to supplier and allow duplicate sale lines'
          git push origin HEAD:main
