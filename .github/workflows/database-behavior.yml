name: Database Behavior

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Initialize isolated local Supabase
        run: |
          mkdir -p .ci-historical-migrations
          mv supabase/migrations/*.sql .ci-historical-migrations/
          supabase init --force
          supabase db start

      - name: Load canonical CI baseline
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/ci-db-baseline.sql

      - name: Apply candidate migrations
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260904183500_consolidate_disbursement_guards.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260904184500_make_read_rpcs_session_independent.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260904184600_make_inventory_reads_session_independent.sql

      - name: Prepare financial reconciliation fixture schema
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          alter table public.invoices add column if not exists stock_deducted_at timestamptz;
          alter table public.invoices add column if not exists operator_id uuid;
          alter table public.invoices add column if not exists operator_nom_snapshot text;
          alter table public.stock_entries add column if not exists note text;
          alter table public.stock_entries add column if not exists reference text;
          alter table public.products add column if not exists category_id text;
          create table if not exists public.categories(
            id text not null,
            boutique_id text not null,
            nom text not null,
            color text,
            primary key (boutique_id,id)
          );
          create table if not exists public.transfer_charge_payments(
            id bigint primary key,
            boutique_id text not null,
            charge_id bigint not null,
            amount numeric not null,
            paid_at timestamptz not null
          );
          SQL

      - name: Apply canonical financial metrics replay locally
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .github/audit/replay-migrations/20260912165219_canonical_financial_metrics.sql

      - name: Reconcile dashboard and report financial metrics
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-financial-metrics-db.sql

      - name: Apply report phase 1 replay locally
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .github/audit/replay-migrations/20260912174106_report_phase1_sales_products.sql

      - name: Reconcile report phase 1 sales products
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-report-phase1-db.sql

      - name: Apply report phase 2 replay locally
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .github/audit/replay-migrations/20260912183020_report_phase2_employee_performance.sql

      - name: Reconcile report phase 2 employee performance
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-report-phase2-db.sql

      - name: Run behavioral database matrix
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-db-behavior.sql

      - name: Verify deterministic return lock migration
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-return-lock-order-db.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260905175824_order_return_product_locks.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260905175824_order_return_product_locks.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-return-lock-order-db.sql -v assert_patched=1

      - name: Verify Ops RLS and foreign-key indexes
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-ops-rls-index-db.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260905175840_optimize_ops_rls_and_foreign_keys.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f .ci-historical-migrations/20260905175840_optimize_ops_rls_and_foreign_keys.sql
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f scripts/test-ops-rls-index-db.sql -v assert_patched=1

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
