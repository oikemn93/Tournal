name: Remove superadmin sync button

on:
  push:
    branches:
      - chore/remove-superadmin-sync-button-20260820
    paths:
      - scripts/remove_superadmin_sync_button.py
      - .github/workflows/remove-superadmin-sync-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-superadmin-sync-button-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/remove_superadmin_sync_button.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tournal maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "chore: remove superadmin sync backend button"
          git push origin HEAD:chore/remove-superadmin-sync-button-20260820
