name: One-shot Ops pipeline alerts
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-ops-pipeline-alerts.mjs
      - .github/workflows/one-shot-ops-pipeline-alerts.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: node scripts/patch-ops-pipeline-alerts.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/components/TournalOpsWorkspace.tsx
          git diff --cached --quiet || git commit -m 'feat: add Ops pipeline board and operational alerts'
          git push
