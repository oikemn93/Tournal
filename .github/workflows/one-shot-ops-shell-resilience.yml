name: One-shot Ops shell resilience
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-ops-shell-resilience.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Harden shell loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/App.tsx')
          s=p.read_text()
          old='''        setTimeout(() => { void Promise.all([loadOpsShell(), loadGroupes<Groupe[]>()])
          .then(([shell, groups]) => {
            const shellUsers = (shell.users as unknown as PlatformUser[]).map(item => item.id===opsUser.id ? { ...item, opsRole:opsProfile?.role } : item);
            setBoutiques(shell.boutiques as unknown as Boutique[]);
            setPlatformUsers(shellUsers);
            if (groups?.length) setGroupes(groups);
            void checkBackend().then(setBackendOk).catch(()=>setBackendOk(false));
          }).catch(()=>undefined); }, 0);'''
          new='''        setTimeout(() => {
          void loadOpsShell().then(shell => {
            const shellUsers = (shell.users as unknown as PlatformUser[]).map(item => item.id===opsUser.id ? { ...item, opsRole:opsProfile?.role } : item);
            setBoutiques(shell.boutiques as unknown as Boutique[]);
            setPlatformUsers(shellUsers);
            void checkBackend().then(setBackendOk).catch(()=>setBackendOk(false));
          }).catch(error => {
            setBackendOk(false);
            toast.error("Tournal Ops indisponible : " + (error instanceof Error ? error.message : String(error)), { duration:8000 });
          });
          if (user.isSuperAdmin) void loadGroupes<Groupe[]>().then(groups => { if (groups?.length) setGroupes(groups); }).catch(()=>undefined);
        }, 0);'''
          if old not in s: raise SystemExit('Ops shell loading anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx
          git commit -m 'fix: keep Ops shell independent from admin groups'
          git push origin HEAD:main
