name: One-shot self supplier balance fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-self-supplier-balance.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Patch supplier balance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/utils/inventory.ts')
          s=p.read_text()
          old='''export function supplierBalance(supplier: Pick<Supplier, "id"|"nom"> | string, entries: StockEntry[], charges?: Charge[]) {\n  const linkedCharges = (charges ?? []).filter(c => matchesSupplier(c, supplier));\n  const regularPurchases = entries\n    .filter(e => matchesSupplier(e, supplier) && (\n      e.movementType === "achat"\n      || (e.supplierId != null && e.movementType === "ajustement")\n      || (e.supplierId == null && isSupplierDebtEntry(e))\n    ))\n    .reduce((s, e) => s + e.montantDu, 0);\n  const transferPurchases = linkedCharges\n    .filter(c => c.source === "transfer")\n    .reduce((s, c) => s + c.montant, 0);\n  const regularPayments = linkedCharges\n    // A supplier receipt is a payable document, not a cash payment. It is\n    // linked to its stock movement for status and maturity, while the distinct\n    // supplier-payment charge is what reduces the balance.\n    .filter(c => c.source !== "transfer" && c.source !== "supplier_receipt")\n    .reduce((s, c) => s + c.montant, 0);\n  const transferPayments = linkedCharges\n    .filter(c => c.source === "transfer")\n    .reduce((s, c) => s + Number(c.paidAmount ?? 0), 0);\n  return Math.max(0, regularPurchases + transferPurchases - regularPayments - transferPayments);\n}'''
          new='''export function supplierBalance(supplier: Pick<Supplier, "id"|"nom"> | string, entries: StockEntry[], charges?: Charge[]) {\n  const linkedCharges = (charges ?? []).filter(c => matchesSupplier(c, supplier));\n  // Supplier debt is ledger-driven. A stock entry only carries inventory cost;\n  // it does not by itself mean money is owed. This is essential for the\n  // special self-supplier, whose receipts intentionally create stock without a\n  // supplier payable. Historical entries without a payable also remain debt-free.\n  const regularPurchases = linkedCharges\n    .filter(c => c.source === "supplier_receipt")\n    .reduce((s, c) => s + Number(c.montant), 0);\n  const transferPurchases = linkedCharges\n    .filter(c => c.source === "transfer")\n    .reduce((s, c) => s + Number(c.montant), 0);\n  const regularPayments = linkedCharges\n    .filter(c => c.source === "supplier_payment")\n    .reduce((s, c) => s + Number(c.montant), 0);\n  const transferPayments = linkedCharges\n    .filter(c => c.source === "transfer")\n    .reduce((s, c) => s + Number(c.paidAmount ?? 0), 0);\n  return Math.max(0, regularPurchases + transferPurchases - regularPayments - transferPayments);\n}'''
          if old not in s: raise SystemExit('supplierBalance block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/utils/inventory.ts
          git commit -m 'fix: derive supplier debt from payable ledger'
          git push origin HEAD:main
