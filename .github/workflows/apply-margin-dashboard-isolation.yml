name: Apply margin dashboard isolation

on:
  push:
    branches: [security/margin-dashboard-isolation-20260903]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/margin-dashboard-isolation-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'products?select=\*' src/lib/api.ts || ! grep -q 'RelationalDashboardView' src/app/App.tsx || grep -q "i.invoice_date) day," supabase/migrations/20260903_isolate_margin_data_and_dashboard.sql; then
            node scripts/apply-margin-dashboard-isolation.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/api.ts src/app/App.tsx supabase/migrations/20260903_isolate_margin_data_and_dashboard.sql
            git commit -m 'security: finalize masked read routing'
            git push
          else
            echo 'Patch already applied.'
          fi
