name: One-shot transfer receive product customization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-transfer-receive-product-customization.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Patch transfer receiving customization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/lib/api.ts'); s=p.read_text()
          old='''export async function acceptStockTransfer(transferId: string, mappings: Array<{transferLineId:number;destinationProductId?:number;createNew?:boolean}> = []) {\n  return dataRequest<{transfer_id:string;status:string;relationship_type:"same_owner"|"commercial";total_amount:number;invoice_id:string|null;charge_id:number|null;supplier_id?:number|null}>("rpc/accept_stock_transfer", { method:"POST", body:JSON.stringify({ p_transfer_id:transferId,p_idempotency_key:crypto.randomUUID(),p_line_mappings:mappings.map(mapping=>({transfer_line_id:mapping.transferLineId,destination_product_id:mapping.destinationProductId ?? null,create_new:mapping.createNew === true})) }) });\n}'''
          new='''export async function acceptStockTransfer(transferId: string, mappings: Array<{transferLineId:number;destinationProductId?:number;createNew?:boolean;newName?:string;categoryId?:string|null;piecesPerLot?:number;lengthPerPiece?:number;sellUnit?:string}> = []) {\n  return dataRequest<{transfer_id:string;status:string;relationship_type:"same_owner"|"commercial";total_amount:number;invoice_id:string|null;charge_id:number|null;supplier_id?:number|null}>("rpc/accept_stock_transfer_custom", { method:"POST", body:JSON.stringify({ p_transfer_id:transferId,p_idempotency_key:crypto.randomUUID(),p_line_mappings:mappings.map(mapping=>({transfer_line_id:mapping.transferLineId,destination_product_id:mapping.destinationProductId ?? null,create_new:mapping.createNew === true,new_name:mapping.newName ?? null,category_id:mapping.categoryId ?? null,pieces_per_lot:mapping.piecesPerLot ?? null,length_per_piece:mapping.lengthPerPiece ?? null,sell_unit:mapping.sellUnit ?? null})) }) });\n}'''
          if old not in s: raise SystemExit('acceptStockTransfer block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/app/screens/TransfersView.tsx'); s=p.read_text()
          s=s.replace('type DraftLine = { draftId: string; productId: number; nom: string; unit: string; qty: number; sellUnit: string; sellQty: number; unitPrice: number };', 'type DraftLine = { draftId: string; productId: number; nom: string; unit: string; qty: number; sellUnit: string; sellQty: number; unitPrice: number };\ntype ReceiveNewConfig = { name:string; categoryId:string; sellUnit:string; piecesPerLot:string; lengthPerPiece:string };')
          s=s.replace('  const [receiveMappings, setReceiveMappings] = useState<Record<number,string>>({});', '  const [receiveMappings, setReceiveMappings] = useState<Record<number,string>>({});\n  const [receiveNewConfigs, setReceiveNewConfigs] = useState<Record<number,ReceiveNewConfig>>({});')
          old='''  function openReceive(transfer: RelationalTransfer) {\n    const mappings: Record<number,string> = {};\n    for (const line of transfer.stock_transfer_lines ?? []) {\n      const exact = boutique.products.find(p => p.actif !== false && p.unit === line.unit && p.nom.trim().toLowerCase() === line.product_name.trim().toLowerCase());\n      mappings[line.id] = exact ? String(exact.id) : "new";\n    }\n    setReceiveMappings(mappings);\n    setReceiving(transfer);\n  }'''
          new='''  function openReceive(transfer: RelationalTransfer) {\n    const mappings: Record<number,string> = {};\n    const configs: Record<number,ReceiveNewConfig> = {};\n    for (const line of transfer.stock_transfer_lines ?? []) {\n      const exact = boutique.products.find(p => p.actif !== false && p.unit === line.unit && p.nom.trim().toLowerCase() === line.product_name.trim().toLowerCase());\n      mappings[line.id] = exact ? String(exact.id) : "new";\n      if (!configs[line.source_product_id]) configs[line.source_product_id] = { name:line.product_name, categoryId:"", sellUnit:line.sell_unit ?? line.unit, piecesPerLot:"", lengthPerPiece:"" };\n    }\n    setReceiveMappings(mappings);\n    setReceiveNewConfigs(configs);\n    setReceiving(transfer);\n  }'''
          if old not in s: raise SystemExit('openReceive not found')
          s=s.replace(old,new,1)
          old='''      seenNewSourceProducts.add(line.source_product_id);\n      return [{ transferLineId:line.id, createNew:true }];'''
          new='''      seenNewSourceProducts.add(line.source_product_id);\n      const config = receiveNewConfigs[line.source_product_id];\n      return [{ transferLineId:line.id, createNew:true, newName:config?.name?.trim() || line.product_name, categoryId:config?.categoryId || null, sellUnit:config?.sellUnit || line.sell_unit || line.unit, piecesPerLot:config?.piecesPerLot ? Number(config.piecesPerLot) : undefined, lengthPerPiece:config?.lengthPerPiece ? Number(config.lengthPerPiece) : undefined }];'''
          if old not in s: raise SystemExit('mapping return not found')
          s=s.replace(old,new,1)
          old='''                {(receiveMappings[line.id] ?? "new") === "new" && <p className="text-[11px] font-semibold" style={{color:TRANSFER_COLOR}}>Nouveau produit · nom, unité et conditionnement repris depuis la boutique émettrice.</p>}'''
          new='''                {(receiveMappings[line.id] ?? "new") === "new" && (()=>{\n                  const config=receiveNewConfigs[line.source_product_id] ?? {name:line.product_name,categoryId:"",sellUnit:line.sell_unit ?? line.unit,piecesPerLot:"",lengthPerPiece:""};\n                  const update=(patch:Partial<ReceiveNewConfig>)=>setReceiveNewConfigs(prev=>({...prev,[line.source_product_id]:{...config,...patch}}));\n                  return <div className="rounded-xl border border-orange-200 bg-orange-50/60 p-3 space-y-2">\n                    <p className="text-[11px] font-black" style={{color:TRANSFER_COLOR}}>NOUVEAU PRODUIT — PERSONNALISEZ AVANT RÉCEPTION</p>\n                    <Field label="NOM DU PRODUIT" color={TRANSFER_COLOR}><input className={inputCls} value={config.name} onChange={e=>update({name:e.target.value})}/></Field>\n                    <Field label="CATÉGORIE" color={TRANSFER_COLOR}><select className={inputCls} value={config.categoryId} onChange={e=>update({categoryId:e.target.value})}><option value="">Reprendre / aucune catégorie</option>{(boutique.categories ?? []).map(cat=><option key={cat.id} value={cat.id}>{cat.nom}</option>)}</select></Field>\n                    <div className="grid grid-cols-3 gap-2">\n                      <Field label="UNITÉ DE VENTE" color={TRANSFER_COLOR}><input className={inputCls} value={config.sellUnit} onChange={e=>update({sellUnit:e.target.value})}/></Field>\n                      <Field label="PIÈCES / LOT" color={TRANSFER_COLOR}><input type="number" min="0" className={inputCls} value={config.piecesPerLot} onChange={e=>update({piecesPerLot:e.target.value})} placeholder="Reprendre"/></Field>\n                      <Field label="LONGUEUR / PIÈCE" color={TRANSFER_COLOR}><input type="number" min="0" step="any" className={inputCls} value={config.lengthPerPiece} onChange={e=>update({lengthPerPiece:e.target.value})} placeholder="Reprendre"/></Field>\n                    </div>\n                    <p className="text-[11px] text-muted-foreground">L’unité de stock reste {line.unit} pour préserver la quantité reçue. Le nom, la catégorie et le conditionnement peuvent être adaptés à votre catalogue.</p>\n                  </div>;\n                })()}'''
          if old not in s: raise SystemExit('new product hint not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/api.ts src/app/screens/TransfersView.tsx
          git commit -m 'feat: customize products created from received transfers'
          git push origin HEAD:main
