name: Apply bounded read RPC routing

on:
  push:
    branches:
      - perf/bounded-rls-read-paths

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded read patch
        run: node scripts/apply-bounded-read-rpcs.mjs
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: route bounded bootstrap reads through indexed RPCs"
          git push
