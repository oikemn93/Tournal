name: Restore client invoice sharing
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/restore-client-invoice-sharing.mjs
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/restore-client-invoice-sharing.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/FacturesView.tsx src/app/screens/ClientsView.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore invoice sharing from client profiles"
          git pull --rebase origin main
          git push origin main
