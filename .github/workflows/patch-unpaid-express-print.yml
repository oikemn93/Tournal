name: Patch unpaid express print
on:
  push:
    paths:
      - scripts/patch-unpaid-express-print.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-unpaid-express-print.mjs
      - name: Regression test
        run: node scripts/test-client-invoice-actions.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/POSView.tsx scripts/test-client-invoice-actions.mjs
          git commit -m "fix: print unpaid express orders" || exit 0
          git pull --rebase origin main
          git push origin main
