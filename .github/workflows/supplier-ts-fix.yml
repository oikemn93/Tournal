name: Supplier ledger finalizer

on:
  push:
    branches: ["fix/supplier-ledger-consistency"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-ledger-consistency
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final supplier repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/screens/FournisseursView.tsx')
          s = p.read_text()
          old = 'const remaining = stockEntrySupplierOutstanding(entry, charge ? [charge] : []); const tone = maturityTone(charge?.dueDate,Number(charge?.paidAmount ?? 0),charge?.montant ?? entry.montantDu);'
          new = 'const remaining = charge ? stockEntrySupplierOutstanding(entry, [charge]) : null; const hasBalance = (remaining ?? 0) > 0; const tone = charge ? maturityTone(charge.dueDate,Number(charge.paidAmount ?? 0),charge.montant) : null;'
          if old not in s and new not in s:
              raise SystemExit('ReceiptTimelineItem anchor not found')
          s = s.replace(old, new, 1)
          old_badge = '<span className="rounded px-1.5 py-0.5 text-[10px] font-black" style={{background:remaining>0?"#fee2e2":"#dcfce7",color:remaining>0?"#b91c1c":"#15803d"}}>{remaining>0?`Reste ${fmt(remaining)}`:"Soldée"}</span>'
          new_badge = '{charge?<span className="rounded px-1.5 py-0.5 text-[10px] font-black" style={{background:hasBalance?"#fee2e2":"#dcfce7",color:hasBalance?"#b91c1c":"#15803d"}}>{hasBalance?`Reste ${fmt(remaining ?? 0)}`:"Soldée"}</span>:<span className="rounded bg-amber-100 px-1.5 py-0.5 text-[10px] font-black text-amber-800">À régulariser</span>}'
          if old_badge not in s and new_badge not in s:
              raise SystemExit('Receipt badge anchor not found')
          s = s.replace(old_badge, new_badge, 1)
          old_csv = 'stockEntrySupplierOutstanding(entry, charges), entry.operatorName ?? ""]'
          new_csv = 'charges.some(charge => charge.source === "supplier_receipt" && charge.stockEntryId === entry.id) ? stockEntrySupplierOutstanding(entry, charges) : "À régulariser", entry.operatorName ?? ""]'
          if old_csv not in s and new_csv not in s:
              raise SystemExit('CSV outstanding anchor not found')
          s = s.replace(old_csv, new_csv, 1)
          p.write_text(s)

          migration = Path('.github/audit/replay-migrations/20260906165307_backfill_legacy_supplier_receipts.sql')
          migration.write_text('''insert into public.charges (\n  id, boutique_id, label, montant, categorie, charge_date, operator_id,\n  note, created_at, updated_at, fournisseur, status, paid_amount,\n  source, supplier_id, due_date, stock_entry_id\n)\nselect\n  nextval('private.charge_id_seq'),\n  se.boutique_id,\n  'Réception stock · ' || s.nom,\n  se.qty * coalesce(se.prix_unit, 0),\n  'Achat stock',\n  se.entry_date,\n  se.operator_id,\n  coalesce(nullif(trim(se.note), ''), 'Régularisation automatique d’une réception historique'),\n  now(),\n  now(),\n  s.nom,\n  case when se.qty * coalesce(se.prix_unit, 0) = 0 then 'paid' else 'pending' end,\n  0,\n  'supplier_receipt',\n  s.id,\n  (se.entry_date at time zone 'Africa/Dakar')::date\n    + coalesce(s.payment_terms_days, aset.supplier_payment_terms_days, 30),\n  se.id\nfrom public.stock_entries se\njoin public.suppliers s\n  on s.boutique_id = se.boutique_id and s.id = se.supplier_id\nleft join public.auth_settings aset\n  on aset.boutique_id = se.boutique_id\nwhere se.type = 'achat'\n  and se.qty > 0\n  and se.supplier_id is not null\n  and s.linked_boutique_id is null\n  and not exists (\n    select 1\n    from public.charges c\n    where c.boutique_id = se.boutique_id\n      and c.stock_entry_id = se.id\n      and c.source = 'supplier_receipt'\n  );\n\ncreate unique index if not exists charges_supplier_receipt_stock_entry_uidx\n  on public.charges (boutique_id, stock_entry_id)\n  where source = 'supplier_receipt' and stock_entry_id is not null;\n''')

          manifest = Path('.github/audit/remote-migration-manifest.txt')
          ms = manifest.read_text().rstrip('\n')
          line = '20260906165307|backfill_legacy_supplier_receipts'
          if line not in ms.splitlines():
              manifest.write_text(ms + '\n' + line + '\n')

          fp = Path('.github/audit/schema-fingerprint.sql')
          fs = fp.read_text()
          fs = fs.replace("('indexes',      192, 'fced787fcb2de669f9753271be7d5134'),", "('indexes',      193, '40da4fb6fd61d7158e4803fc3323f732'),")
          fp.write_text(fs)

          test = Path('scripts/test-supplier-ledger-contract.mjs')
          ts = test.read_text()
          marker = "need(suppliers.includes('ACHATS · 30 JOURS'),'supplier metrics must state the loaded time window');"
          assertion = "need(suppliers.includes('À régulariser'),'receipt without payable must never be displayed as paid');"
          if assertion not in ts:
              if marker not in ts: raise SystemExit('supplier contract anchor not found')
              ts = ts.replace(marker, marker + '\n' + assertion)
              test.write_text(ts)
          PY
      - name: Verify targeted contract and TypeScript
        run: |
          node scripts/test-supplier-ledger-contract.mjs
          pnpm exec tsc --noEmit
      - name: Commit final repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/FournisseursView.tsx scripts/test-supplier-ledger-contract.mjs .github/audit/replay-migrations/20260906165307_backfill_legacy_supplier_receipts.sql .github/audit/remote-migration-manifest.txt .github/audit/schema-fingerprint.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: reconcile legacy supplier receipts"
          git push origin HEAD:fix/supplier-ledger-consistency
