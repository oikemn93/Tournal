name: Supplier TypeScript fixer

on:
  push:
    branches: ["fix/supplier-ledger-consistency"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supplier-ledger-consistency
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix literal status typing
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/status:(Number(dMontant)>0?"pending":"paid") as const/status:Number(dMontant)>0 ? "pending" as const : "paid" as const/' src/app/screens/StockView.tsx
          sed -i 's/status:(Number(nMontant)>0?"pending":"paid") as const/status:Number(nMontant)>0 ? "pending" as const : "paid" as const/' src/app/screens/StockView.tsx
          grep -n 'status:Number.*pending.*paid' src/app/screens/StockView.tsx
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/StockView.tsx
          git commit -m "fix: type zero-value receipt status"
          git push origin HEAD:fix/supplier-ledger-consistency
