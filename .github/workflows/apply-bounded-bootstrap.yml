name: Apply bounded bootstrap refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bounded-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch bounded bootstrap and lazy history
        shell: bash
        run: |
