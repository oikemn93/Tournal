          assert old_import in ftext
          ftext = ftext.replace(old_import, 'import { boundedBootstrapCutoffIso, createSale, recordPayment, recordMultiPayment, returnSale, openCaisseSession, closeCaisseSession, createInvoiceShare, loadBoutiqueHistoryRange } from "../../lib/api";', 1)
          day_state = '  const [dayFilterActive, setDayFilterActive] = useState(initialStatus !== "impayé" && initialStatus !== "en retard");\n'
          assert day_state in ftext
          ftext = ftext.replace(day_state, day_state + '''  const loadedHistoryDays = React.useRef(new Set<string>());\n  const [historyLoadingDay, setHistoryLoadingDay] = useState<string|null>(null);\n  useEffect(() => {\n    if (!dayFilterActive) return;\n    const cutoffDay = boundedBootstrapCutoffIso().slice(0,10);\n    if (selectedDay >= cutoffDay || loadedHistoryDays.current.has(selectedDay)) return;\n    let cancelled = false;\n    const fromAt = `${selectedDay}T00:00:00.000Z`;\n    const toDate = new Date(`${selectedDay}T00:00:00.000Z`);\n    toDate.setUTCDate(toDate.getUTCDate() + 1);\n    setHistoryLoadingDay(selectedDay);\n    void loadBoutiqueHistoryRange(boutique.id, fromAt, toDate.toISOString())\n      .then(patch => {\n        if (cancelled) return;\n        loadedHistoryDays.current.add(selectedDay);\n        const merged = [...new Map([...boutique.invoices, ...(patch.invoices ?? [])].map(invoice => [invoice.id, invoice])).values()];\n        onUpdate({ invoices:merged });\n      })\n      .catch(error => console.warn(`Historique factures ${selectedDay} indisponible`, error))\n      .finally(() => { if (!cancelled) setHistoryLoadingDay(null); });\n    return () => { cancelled = true; };\n  }, [boutique.id, selectedDay, dayFilterActive]);\n''', 1)
          nav_marker = '<CalendarDays size={13}/> {dayFilterActive ? dayLabel : "Toutes les factures"}'
          assert nav_marker in ftext
          ftext = ftext.replace(nav_marker, '<CalendarDays size={13}/> {historyLoadingDay===selectedDay ? "Chargement…" : dayFilterActive ? dayLabel : "Période chargée"}', 1)
          factures.write_text(ftext)

