          marker = '/** Loads account metadata for administration screens from named relational tables. */'
          assert marker in text
          history_code = r'''
export type BoutiqueHistoryPatch = BoutiqueSyncPatch & {
  clientCreditRefunds?: Array<Record<string, any>>;
};

/**
 * Loads an explicitly requested historical period. Discovery calls fetch only
 * compact IDs and are paged in 1,000-row chunks; the existing Sync v2 narrow
 * loader then resolves canonical rows. Nothing historical is rewritten.
 */
export async function loadBoutiqueHistoryRange(
  boutiqueId: string,
  fromAt: string,
  toAt: string,
): Promise<BoutiqueHistoryPatch> {
  const bid = encodeURIComponent(boutiqueId);
  const scoped = `&boutique_id=eq.${bid}`;
  const from = encodeURIComponent(new Date(fromAt).toISOString());
  const to = encodeURIComponent(new Date(toAt).toISOString());
  const [invoiceRefs, paymentRefs, chargeRefs, sessionRefs, refundRows] = await Promise.all([
    dataRequestAll<{ id:string }>(`invoices?select=id${scoped}&invoice_date=gte.${from}&invoice_date=lt.${to}`, "invoice_date.asc,id.asc"),
    dataRequestAll<{ invoice_id:string }>(`invoice_payments?select=invoice_id${scoped}&paid_at=gte.${from}&paid_at=lt.${to}`, "paid_at.asc,id.asc"),
    dataRequestAll<{ id:number }>(`charges?select=id${scoped}&charge_date=gte.${from}&charge_date=lt.${to}`, "charge_date.asc,id.asc"),
    dataRequestAll<{ id:string }>(`caisse_sessions?select=id${scoped}&opened_at=gte.${from}&opened_at=lt.${to}`, "opened_at.asc,id.asc"),
    dataRequestAll<any>(`client_credit_refunds?select=*${scoped}&refunded_at=gte.${from}&refunded_at=lt.${to}`, "refunded_at.asc,id.asc"),
  ]);
  const invoiceIds = [...new Set([...invoiceRefs.map(row => row.id), ...paymentRefs.map(row => row.invoice_id)])];
  const events: BoutiqueSyncEvent[] = [
    ...invoiceIds.map(id => ({ event_id:`history:invoice:${id}`, revision:0, domain:"sales" as const, entity_type:"invoice" as const, entity_id:id, operation:"UPDATE" as const })),
    ...chargeRefs.map(row => ({ event_id:`history:charge:${row.id}`, revision:0, domain:"charges" as const, entity_type:"charge" as const, entity_id:String(row.id), operation:"UPDATE" as const })),
    ...sessionRefs.map(row => ({ event_id:`history:caisse:${row.id}`, revision:0, domain:"caisse" as const, entity_type:"caisse_session" as const, entity_id:String(row.id), operation:"UPDATE" as const })),
  ];
  const patch = events.length ? await loadBoutiqueSyncPatch(boutiqueId, events) : { deleted:{} };
  const day = (value?: string | null) => value ? new Date(value).toLocaleDateString("fr-FR") : "";
  return {
    ...patch,
    clientCreditRefunds: refundRows.map(r => ({
      id:Number(r.id), clientId:Number(r.client_id), amount:Number(r.amount), paymentMethod:r.payment_method,
      refundedAt:r.refunded_at, date:day(r.refunded_at), dateRaw:r.refunded_at,
      operatorId:r.operator_id ?? undefined, operatorName:r.operator_name, note:r.note ?? undefined,
    })),
  };
}

/** Full product movement history is fetched only when the user opens that
 * product. The transport itself remains paged; the result is kept local to the
 * detail view and is never merged into the current-stock baseline. */
export async function loadProductStockHistory(boutiqueId: string, productId: number) {
  const bid = encodeURIComponent(boutiqueId);
  const refs = await dataRequestAll<{ id:number }>(
    `stock_entries?select=id&boutique_id=eq.${bid}&product_id=eq.${encodeURIComponent(String(productId))}`,
    "entry_date.desc,id.desc",
  );
  if (!refs.length) return [];
  const events: BoutiqueSyncEvent[] = refs.map(row => ({
    event_id:`history:stock:${row.id}`, revision:0, domain:"stock", entity_type:"stock_entry",
    entity_id:String(productId), record_id:String(row.id), operation:"UPDATE",
  }));
  return (await loadBoutiqueSyncPatch(boutiqueId, events)).entries ?? [];
}

'''
          text = text.replace(marker, history_code + marker, 1)
