          state_anchor = '  const [stockCorrectionBusy, setStockCorrectionBusy] = useState<number|null>(null);\n'
          assert state_anchor in stext
          stext = stext.replace(state_anchor, state_anchor + '''  const [productHistory, setProductHistory] = useState<Record<number, StockEntry[]>>({});\n  const [productHistoryLoading, setProductHistoryLoading] = useState<number|null>(null);\n\n  useEffect(() => {\n    if (!detail || productHistory[detail.id] || productHistoryLoading === detail.id) return;\n    let cancelled = false;\n    setProductHistoryLoading(detail.id);\n    void loadProductStockHistory(boutique.id, detail.id)\n      .then(rows => { if (!cancelled) setProductHistory(current => ({ ...current, [detail.id]:rows })); })\n      .catch(error => console.warn("Historique stock indisponible", error))\n      .finally(() => { if (!cancelled) setProductHistoryLoading(null); });\n    return () => { cancelled = true; };\n  }, [boutique.id, detail?.id]);\n''', 1)
          old_hist = '{entries.filter(e => e.productId === detail.id).sort(sortStockEntriesNewestFirst).map(e => {'
          new_hist = '{[...new Map([...(productHistory[detail.id] ?? []), ...entries.filter(e => e.productId === detail.id && e.movementType !== "bootstrap")].map(e => [e.id, e])).values()].sort(sortStockEntriesNewestFirst).map(e => {'
          assert old_hist in stext
