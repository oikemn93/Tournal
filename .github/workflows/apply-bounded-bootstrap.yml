name: Apply bounded bootstrap refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bounded-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/apply_bounded_bootstrap.py
      - run: pnpm build
      - run: node scripts/check-no-network-polling.mjs
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/api.ts src/app/utils/payments.ts src/app/utils/inventory.ts src/app/screens/StockView.tsx src/app/screens/FacturesView.tsx src/app/screens/RapportView.tsx supabase/migrations/20260830114500_supplier_current_balances_for_bounded_bootstrap.sql
          git diff --cached --check
          git commit -m 'perf: bound bootstrap state and lazy-load history'
          git push origin HEAD:main
