          migration.write_text('''-- Compact current-state supplier ledger projection for bounded clients.\ncreate or replace function public.get_supplier_current_balances(p_boutique_id text)\nreturns table(supplier_id bigint, balance numeric)\nlanguage sql stable security definer\nset search_path = 'pg_catalog', 'public', 'private'\nas $function$\n  select s.id, greatest(0::numeric,\n    coalesce((select sum(e.qty * coalesce(e.prix_unit,0)) from public.stock_entries e where e.boutique_id=p_boutique_id and e.supplier_id=s.id and e.qty>0 and e.type in ('achat','ajustement')),0)\n    + coalesce((select sum(c.montant) from public.charges c where c.boutique_id=p_boutique_id and c.supplier_id=s.id and c.source='transfer'),0)\n    - coalesce((select sum(c.montant) from public.charges c where c.boutique_id=p_boutique_id and c.supplier_id=s.id and c.source is distinct from 'transfer' and c.source is distinct from 'supplier_receipt'),0)\n    - coalesce((select sum(c.paid_amount) from public.charges c where c.boutique_id=p_boutique_id and c.supplier_id=s.id and c.source='transfer'),0)\n  )::numeric\n  from public.suppliers s\n  where s.boutique_id=p_boutique_id\n    and ((select private.auth_is_super_admin()) or ((select private.auth_is_active_user()) and exists (\n      select 1 from public.boutique_assignments ba where ba.boutique_id=p_boutique_id and ba.user_id=(select auth.uid())\n    )));\n$function$;\nrevoke all on function public.get_supplier_current_balances(text) from public, anon;\ngrant execute on function public.get_supplier_current_balances(text) to authenticated;\n''')
