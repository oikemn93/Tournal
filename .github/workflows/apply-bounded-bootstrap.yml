            'dataRequestAll<any>(`stock_entries?select=*${scoped()}`, "entry_date.desc,id.desc")': 'dataRequestAll<any>(`stock_entries?select=*${scoped()}${stockWindow}`, "entry_date.desc,id.desc")',
