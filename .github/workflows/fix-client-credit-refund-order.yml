name: Fix client credit refund order
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-client-credit-refund-order.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: python tools/fix_client_credit_refund_order.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/ClientsView.tsx
          git diff --cached --quiet || git commit -m "fix: keep client refund data in render scope"
          git push
