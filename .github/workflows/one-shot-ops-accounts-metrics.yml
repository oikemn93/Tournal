name: One-shot Ops accounts metrics
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-ops-accounts-metrics.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: node scripts/patch-ops-accounts-metrics.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ops.ts src/app/components/TournalOpsWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add Ops accounts contacts and SLA dashboard'
          git push origin HEAD:main
