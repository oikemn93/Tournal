name: Generalize client payment receipts
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generalize-client-payment-receipts.mjs
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generalize-client-payment-receipts.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.ts src/app/screens/ClientsView.tsx src/app/utils/invoice.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make every client payment receipt shareable"
          git pull --rebase origin main
          git push origin main
