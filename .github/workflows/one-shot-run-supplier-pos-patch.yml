name: One-shot run supplier POS patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-run-supplier-pos-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python scripts/patch_supplier_return_pos_duplicates.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.tsx src/app/screens/StockView.tsx src/app/screens/FournisseursView.tsx src/app/screens/POSView.tsx
          git commit -m 'fix: return to supplier and allow duplicate sale lines'
          git push origin HEAD:main
