name: Apply deferred bootstrap history
on:
  push:
    branches: [perf/transaction-grade-read-paths-20260904]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/transaction-grade-read-paths-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-deferred-bootstrap-history.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx src/lib/api.ts
          git diff --cached --quiet && exit 0
          git commit -m "perf: defer older boutique history"
          git push
