name: Report P3
on:
  pull_request:
    paths:
      - "src/app/App.tsx"
      - "src/app/screens/**"
      - "src/lib/reportApi.ts"
      - ".github/audit/replay-migrations/20260913110000_report_sales_payment_methods.sql"
      - "scripts/test-report-p3-contract.mjs"
      - ".github/workflows/report-p3.yml"
jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-report-p3-contract.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
