name: One-shot deployment recovery patch
on:
  push:
    branches:
      - fix/deployment-recovery-ops-guard
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deployment-recovery-ops-guard
      - name: Apply patch
        run: python scripts/one-shot-deployment-recovery.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/main.tsx public/service-worker.js scripts/test-offline-pos-contract.mjs scripts/test-ops-boutique-entry.mjs
          git commit -m "fix: recover stale deployments and guard Ops routing"
          git push
