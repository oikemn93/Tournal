name: Fix persistent idle lock

on:
  push:
    branches:
      - fix/persist-idle-lock-refresh-20260820
    paths:
      - scripts/fix_persistent_idle_lock.py
      - .github/workflows/fix-persistent-idle-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persist-idle-lock-refresh-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python scripts/fix_persistent_idle_lock.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tournal maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "security: persist idle lock across refresh"
          git push origin HEAD:fix/persist-idle-lock-refresh-20260820
