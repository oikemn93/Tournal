name: Fix annulation permission
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix-annulation-permission.mjs
      - .github/workflows/fix-annulation-permission.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node scripts/fix-annulation-permission.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/POSView.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: honor order cancellation permission in POS"
          git pull --rebase origin main
          git push origin main
