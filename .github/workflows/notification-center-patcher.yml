name: Notification Center patcher

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/notification-center-settings-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded patch
        run: python scripts/notification_center_patch.py
      - name: Commit patched source if needed
        shell: bash
        run: |
          if git diff --quiet -- src/app/App.tsx src/lib/notifications.ts; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/lib/notifications.ts
          git commit -m "feat: connect notification center and settings"
          git push origin HEAD:${{ github.head_ref }}
