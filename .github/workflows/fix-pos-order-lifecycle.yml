name: Fix POS order lifecycle
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-pos-order-lifecycle.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/fix-pos-order-lifecycle.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit functional fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/screens/POSView.tsx supabase/migrations/20260902224500_align_pos_client_stock_lifecycle.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: align counter and client stock lifecycle"
          git pull --rebase origin main
          git push origin main
