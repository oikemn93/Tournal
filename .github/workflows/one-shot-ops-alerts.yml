name: One-shot Ops operational alerts
on:
  push:
    paths:
      - scripts/patch-ops-alerts.mjs
      - .github/workflows/one-shot-ops-alerts.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/patch-ops-alerts.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/TournalOpsWorkspace.tsx
          git commit -m "feat: surface Ops operational alerts"
          git push
